          package app.jarvis

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** True when the app language is English. Shared by the new feature files. */
          internal fun isEn(ctx: Context): Boolean =
              (ctx.getSharedPreferences("jarvis", Context.MODE_PRIVATE).getString("lang", "tr") ?: "tr") == "en"

          internal fun tx(en: Boolean, tr: String, e: String): String = if (en) e else tr

          /**
           * Counts requests, tokens and an estimated cost per provider. Everything stays on the phone.
           * Prices are rough defaults and can be edited from the usage screen, the bill from the provider is the truth.
           */
          object Usage {
              private var appCtx: Context? = null

              /** Keys that have an editable price. Token keys are USD per 1M tokens, the others per unit. */
              val TOKEN_KEYS: List<String> = listOf("gemini", "anthropic", "openai", "groq", "openrouter")
              val UNIT_KEYS: List<String> = listOf("tts:gemini", "tts:openai", "tts:eleven", "img:gemini", "img:openai")

              fun init(ctx: Context) {
                  appCtx = ctx.applicationContext
              }

              private fun sp(): SharedPreferences? =
                  appCtx?.getSharedPreferences("jarvis_usage", Context.MODE_PRIVATE)

              private fun mainPrefs(): SharedPreferences? =
                  appCtx?.getSharedPreferences("jarvis", Context.MODE_PRIVATE)

              fun estimateTokens(s: String): Long = (s.length / 4 + 1).toLong()

              // ---------- recording ----------

              fun llm(p: Prov, model: String, inTok: Long, outTok: Long) {
                  val price = tokenPrice(p.id, model)
                  val cost = inTok * price.first / 1_000_000.0 + outTok * price.second / 1_000_000.0
                  add(p.id, 1, inTok, outTok, 0L, 0, cost)
              }

              fun fromGemini(model: String, res: JSONObject) {
                  val um = res.optJSONObject("usageMetadata")
                  val i = um?.optLong("promptTokenCount", 0L) ?: 0L
                  val o = (um?.optLong("candidatesTokenCount", 0L) ?: 0L) + (um?.optLong("thoughtsTokenCount", 0L) ?: 0L)
                  llm(Prov.GEMINI, model, i, o)
              }

              fun tts(engine: String, chars: Int) {
                  val key = "tts:" + engine
                  val per1k = unitPrice(key)
                  add(key, 1, 0L, 0L, chars.toLong(), 0, chars * per1k / 1000.0)
              }

              fun image(engine: String) {
                  val key = "img:" + engine
                  add(key, 1, 0L, 0L, 0L, 1, unitPrice(key))
              }

              @Synchronized
              private fun add(key: String, req: Int, inTok: Long, outTok: Long, chars: Long, imgs: Int, cost: Double) {
                  val s = sp() ?: return
                  try {
                      val root = JSONObject(s.getString("data", "{}") ?: "{}")
                      val day = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                      val month = day.substring(0, 7)
                      bump(root, "d", day, key, req, inTok, outTok, chars, imgs, cost)
                      bump(root, "m", month, key, req, inTok, outTok, chars, imgs, cost)
                      bump(root, "t", "all", key, req, inTok, outTok, chars, imgs, cost)
                      // Keep only the last 40 days of daily numbers.
                      val days = root.optJSONObject("d")
                      if (days != null) {
                          val names = ArrayList<String>()
                          val it = days.keys()
                          while (it.hasNext()) names.add(it.next())
                          names.sort()
                          while (names.size > 40) days.remove(names.removeAt(0))
                      }
                      s.edit().putString("data", root.toString()).apply()
                  } catch (e: Exception) {
                  }
              }

              private fun bump(
                  root: JSONObject, group: String, bucket: String, key: String,
                  req: Int, inTok: Long, outTok: Long, chars: Long, imgs: Int, cost: Double
              ) {
                  val g = root.optJSONObject(group) ?: JSONObject().also { root.put(group, it) }
                  val b = g.optJSONObject(bucket) ?: JSONObject().also { g.put(bucket, it) }
                  val e = b.optJSONObject(key) ?: JSONObject().also { b.put(key, it) }
                  e.put("r", e.optInt("r", 0) + req)
                  e.put("i", e.optLong("i", 0L) + inTok)
                  e.put("o", e.optLong("o", 0L) + outTok)
                  e.put("x", e.optLong("x", 0L) + chars)
                  e.put("g", e.optInt("g", 0) + imgs)
                  e.put("c", e.optDouble("c", 0.0) + cost)
              }

              @Synchronized
              fun reset() {
                  sp()?.edit()?.remove("data")?.apply()
              }

              // ---------- prices ----------

              /** Input and output USD per 1M tokens. */
              fun tokenPrice(key: String, model: String): Pair<Double, Double> {
                  val ov = mainPrefs()?.getString("price_" + key, "") ?: ""
                  if (ov.contains(",")) {
                      val a = ov.substringBefore(",").trim().toDoubleOrNull()
                      val b = ov.substringAfter(",").trim().toDoubleOrNull()
                      if (a != null && b != null) return a to b
                  }
                  return defaultTokenPrice(key, model.lowercase(Locale.ROOT))
              }

              private fun defaultTokenPrice(key: String, m: String): Pair<Double, Double> = when (key) {
                  "gemini" -> when {
                      m.contains("lite") -> 0.10 to 0.40
                      m.contains("pro") -> 1.25 to 10.0
                      else -> 0.30 to 2.50
                  }
                  "anthropic" -> when {
                      m.contains("haiku") -> 1.0 to 5.0
                      m.contains("opus") -> 5.0 to 25.0
                      else -> 3.0 to 15.0
                  }
                  "openai" -> when {
                      m.contains("nano") -> 0.10 to 0.40
                      m.contains("mini") -> 0.40 to 1.60
                      m.contains("4o") -> 2.50 to 10.0
                      else -> 2.0 to 8.0
                  }
                  "groq" -> 0.59 to 0.79
                  else -> 0.50 to 1.50
              }

              /** USD per 1000 characters for speech, USD per image for pictures. */
              fun unitPrice(key: String): Double {
                  val ov = (mainPrefs()?.getString("price_" + key, "") ?: "").trim().toDoubleOrNull()
                  if (ov != null) return ov
                  return when (key) {
                      "tts:gemini" -> 0.016
                      "tts:openai" -> 0.015
                      "tts:eleven" -> 0.18
                      "img:gemini" -> 0.04
                      "img:openai" -> 0.04
                      else -> 0.0
                  }
              }

              fun priceLine(key: String, en: Boolean): String {
                  return if (key in TOKEN_KEYS) {
                      val p = tokenPrice(key, mainPrefs()?.getString("model_" + key, "") ?: "")
                      fmtNum(p.first) + " / " + fmtNum(p.second) + tx(en, " USD, 1M token (girdi / çıktı)", " USD per 1M tokens (in / out)")
                  } else if (key.startsWith("tts:")) {
                      fmtNum(unitPrice(key)) + tx(en, " USD, 1000 karakter", " USD per 1000 characters")
                  } else {
                      fmtNum(unitPrice(key)) + tx(en, " USD, görsel başına", " USD per image")
                  }
              }

              private fun fmtNum(v: Double): String = String.format(Locale.US, "%.3f", v).trimEnd('0').trimEnd('.')

              fun label(key: String, en: Boolean): String = when (key) {
                  "gemini" -> "Google Gemini"
                  "anthropic" -> "Anthropic Claude"
                  "openai" -> "OpenAI"
                  "groq" -> "Groq"
                  "openrouter" -> "OpenRouter"
                  "tts:gemini" -> tx(en, "Gemini ses", "Gemini voice")
                  "tts:openai" -> tx(en, "OpenAI ses", "OpenAI voice")
                  "tts:eleven" -> tx(en, "ElevenLabs ses", "ElevenLabs voice")
                  "img:gemini" -> tx(en, "Gemini görsel", "Gemini images")
                  "img:openai" -> tx(en, "OpenAI görsel", "OpenAI images")
                  else -> key
              }

              // ---------- report ----------

              fun report(en: Boolean): String {
                  val s = sp() ?: return tx(en, "Sayaç hazır değil.", "Counter not ready.")
                  val root = try {
                      JSONObject(s.getString("data", "{}") ?: "{}")
                  } catch (e: Exception) {
                      JSONObject()
                  }
                  val day = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  val sb = StringBuilder()
                  section(sb, tx(en, "BUGÜN", "TODAY"), root.optJSONObject("d")?.optJSONObject(day), en)
                  section(sb, tx(en, "BU AY", "THIS MONTH"), root.optJSONObject("m")?.optJSONObject(day.substring(0, 7)), en)
                  section(sb, tx(en, "TOPLAM", "ALL TIME"), root.optJSONObject("t")?.optJSONObject("all"), en)
                  sb.append(tx(en, "Tutarlar tahmindir; asıl fatura sağlayıcıdadır.", "Amounts are estimates; the real bill is with the provider."))
                  return sb.toString()
              }

              /** One short spoken-friendly line for the usage_report tool. */
              fun spoken(en: Boolean): String {
                  val s = sp() ?: return "error: counter not ready"
                  val root = try {
                      JSONObject(s.getString("data", "{}") ?: "{}")
                  } catch (e: Exception) {
                      JSONObject()
                  }
                  val day = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  val today = root.optJSONObject("d")?.optJSONObject(day)
                  val month = root.optJSONObject("m")?.optJSONObject(day.substring(0, 7))
                  return "today: " + totals(today) + "; this month: " + totals(month) +
                      ". Costs are rough estimates in USD. Per provider this month:\n" + section2(month, en)
              }

              private fun totals(b: JSONObject?): String {
                  var r = 0
                  var c = 0.0
                  if (b != null) {
                      val it = b.keys()
                      while (it.hasNext()) {
                          val e = b.optJSONObject(it.next()) ?: continue
                          r += e.optInt("r", 0)
                          c += e.optDouble("c", 0.0)
                      }
                  }
                  return r.toString() + " requests, about " + String.format(Locale.US, "%.2f", c) + " USD"
              }

              private fun section2(b: JSONObject?, en: Boolean): String {
                  if (b == null || b.length() == 0) return "none"
                  val sb = StringBuilder()
                  val it = b.keys()
                  while (it.hasNext()) {
                      val k = it.next()
                      val e = b.optJSONObject(k) ?: continue
                      sb.append("- ").append(label(k, en)).append(": ").append(e.optInt("r", 0)).append(" requests, about ")
                          .append(String.format(Locale.US, "%.3f", e.optDouble("c", 0.0))).append(" USD\n")
                  }
                  return sb.toString().trim()
              }

              private fun section(sb: StringBuilder, title: String, b: JSONObject?, en: Boolean) {
                  sb.append(title).append('\n')
                  if (b == null || b.length() == 0) {
                      sb.append("  ").append(tx(en, "kayıt yok", "no records")).append("\n\n")
                      return
                  }
                  var req = 0
                  var cost = 0.0
                  val keys = ArrayList<String>()
                  val it = b.keys()
                  while (it.hasNext()) keys.add(it.next())
                  keys.sort()
                  for (k in keys) {
                      val e = b.optJSONObject(k) ?: continue
                      req += e.optInt("r", 0)
                      cost += e.optDouble("c", 0.0)
                      sb.append("  ").append(label(k, en)).append(": ").append(e.optInt("r", 0)).append(tx(en, " istek", " req"))
                      if (k.startsWith("tts:")) {
                          sb.append(", ").append(e.optLong("x", 0L)).append(tx(en, " karakter", " chars"))
                      } else if (k.startsWith("img:")) {
                          sb.append(", ").append(e.optInt("g", 0)).append(tx(en, " görsel", " images"))
                      } else {
                          sb.append(", ").append(compact(e.optLong("i", 0L))).append(" → ").append(compact(e.optLong("o", 0L)))
                              .append(" tok")
                      }
                      sb.append(", ~$").append(String.format(Locale.US, "%.3f", e.optDouble("c", 0.0))).append('\n')
                  }
                  sb.append("  ").append(tx(en, "Toplam: ", "Total: ")).append(req).append(tx(en, " istek, ~$", " requests, ~$"))
                      .append(String.format(Locale.US, "%.2f", cost)).append("\n\n")
              }

              private fun compact(n: Long): String = when {
                  n >= 1_000_000L -> String.format(Locale.US, "%.1fM", n / 1_000_000.0)
                  n >= 1_000L -> String.format(Locale.US, "%.1fk", n / 1_000.0)
                  else -> n.toString()
              }
          }
