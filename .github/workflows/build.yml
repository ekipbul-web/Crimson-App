          /** Faint grid and a soft glow behind the orb. */
          class HudBackground(context: Context) : View(context) {
              private val d = resources.displayMetrics.density
              private val line = Paint().apply {
                  color = Color.parseColor("#0E2033")
                  strokeWidth = d
              }
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val step = 36f * d
                  var x = 0f
                  while (x < w) {
                      c.drawLine(x, 0f, x, h, line)
                      x += step
                  }
                  var y = 0f
                  while (y < h) {
                      c.drawLine(0f, y, w, y, line)
                      y += step
                  }
                  glow.shader = RadialGradient(
                      w / 2f, 170f * d, w * 0.95f,
                      Color.parseColor("#264CD9F2"), Color.parseColor("#004CD9F2"),
                      Shader.TileMode.CLAMP
                  )
                  c.drawRect(0f, 0f, w, h, glow)
              }
          }

          /** The arc-reactor orb. Reacts to the microphone level while listening. */
          class OrbView(context: Context) : View(context) {
              var color: Int = CYAN
              var speed: Float = 1f
              var pulseSpeed: Float = 1f
              var speaking: Boolean = false

              private var target = 0f
              private var level = 0f
              private var angle = 0f
              private var t = 0f
              private val density = resources.displayMetrics.density
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val tick = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val rect = RectF()
              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1000L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      angle = (angle + 0.9f * speed) % 360f
                      t += 0.05f * pulseSpeed
                      target *= 0.88f
                      val goal = if (speaking) 0.35f + 0.25f * sin(t * 1.3f) else target
                      level += (goal - level) * 0.3f
                      invalidate()
                  }
              }

              fun pushLevel(v: Float) {
                  if (v > target) target = v
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  anim.start()
              }

              override fun onDetachedFromWindow() {
                  anim.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f - 3f * density
                  val sw = 2.5f * density

                  // soft glow that swells with the voice
                  fill.color = color
                  fill.alpha = (28 + 70 * level).toInt().coerceIn(0, 255)
                  c.drawCircle(cx, cy, r * (0.55f + 0.45f * level), fill)

                  // tick ring
                  tick.color = color
                  tick.strokeWidth = 1.5f * density
                  for (i in 0 until 48) {
                      val a = Math.toRadians((i * 7.5 + angle * 0.25).toDouble())
                      val ca = cos(a).toFloat()
                      val sa = sin(a).toFloat()
                      val major = i % 4 == 0
                      val len = if (major) 0.10f else 0.05f
                      tick.alpha = if (major) 210 else 90
                      c.drawLine(
                          cx + ca * r * (1f - len), cy + sa * r * (1f - len),
                          cx + ca * r, cy + sa * r, tick
                      )
                  }

                  // outer arcs
                  val r1 = r * 0.80f
                  ring.color = color
                  ring.alpha = 255
                  ring.strokeWidth = sw
                  rect.set(cx - r1, cy - r1, cx + r1, cy + r1)
                  c.drawArc(rect, angle, 110f, false, ring)
                  c.drawArc(rect, angle + 180f, 110f, false, ring)

                  // inner arcs, opposite direction
                  val r2 = r * 0.62f
                  ring.alpha = 150
                  ring.strokeWidth = sw * 0.7f
                  rect.set(cx - r2, cy - r2, cx + r2, cy + r2)
                  c.drawArc(rect, -angle * 1.4f, 90f, false, ring)
                  c.drawArc(rect, -angle * 1.4f + 180f, 90f, false, ring)

                  ring.alpha = 70
                  ring.strokeWidth = density
                  c.drawCircle(cx, cy, r * 0.46f, ring)

                  // core
                  val k = 0.8f + 0.2f * sin(t) + level * 0.6f
                  fill.color = color
                  fill.alpha = 70
                  c.drawCircle(cx, cy, r * 0.30f * k, fill)
                  fill.alpha = 255
                  c.drawCircle(cx, cy, r * 0.17f * k, fill)
              }
          }

