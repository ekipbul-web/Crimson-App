name: Build Crimson APK

# Every push builds a debug APK (artifact). Pushing a tag like v2.1.0 also builds a signed
# release APK and attaches it to the GitHub Releases page. See the secrets listed in the
# "release" job below.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          cat > settings.gradle.kts <<'JARVIS_EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF_0
          cat > build.gradle.kts <<'JARVIS_EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF_1
          mkdir -p app
          cat > app/build.gradle.kts <<'JARVIS_EOF_2'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.jarvis"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.jarvis"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME")
                      ?: ("3.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0"))
              }

              // The release keystore comes from the environment, set by the release workflow.
              signingConfigs {
                  create("release") {
                      val ks = System.getenv("KEYSTORE_FILE")
                      if (!ks.isNullOrEmpty()) {
                          storeFile = File(ks)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      if (!System.getenv("KEYSTORE_FILE").isNullOrEmpty()) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47")
              implementation("com.tom-roush:pdfbox-android:2.0.27.0")
          }
          JARVIS_EOF_2
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF_3'
