          import android.widget.FrameLayout
          import android.widget.Toast
          import java.util.concurrent.Executors

          /** Menu and dialogs for routines, documents, the interpreter, smart home, usage and image settings. */
          object PlusUi {
              private val exec = Executors.newSingleThreadExecutor()

              private fun builder(act: Activity): AlertDialog.Builder =
                  AlertDialog.Builder(act, R.style.JarvisDialog)

              private fun toast(act: Activity, s: String) {
                  Toast.makeText(act, s, Toast.LENGTH_LONG).show()
              }

              private fun prefs(act: Activity) = act.getSharedPreferences("jarvis", Activity.MODE_PRIVATE)

              private fun dp(act: Activity, v: Int): Int = (v * act.resources.displayMetrics.density + 0.5f).toInt()

              private fun ask(
                  act: Activity, title: String, hint: String, initial: String, secret: Boolean, onOk: (String) -> Unit
              ) {
                  val et = EditText(act).apply {
                      this.hint = hint
                      setTextColor(Color.parseColor("#F4E7E9"))
                      setHintTextColor(Color.parseColor("#A88F95"))
                      inputType = if (secret) {
                          InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      } else {
                          InputType.TYPE_CLASS_TEXT
                      }
                      setSingleLine(false)
                      setText(initial)
                  }
                  val holder = FrameLayout(act).apply {
                      setPadding(dp(act, 20), dp(act, 8), dp(act, 20), 0)
                      addView(et)
                  }
                  val en = isEn(act)
                  builder(act).setTitle(title).setView(holder)
                      .setPositiveButton(tx(en, "Kaydet", "Save")) { _, _ -> onOk(et.text.toString().trim()) }
                      .setNegativeButton(tx(en, "Vazgeç", "Cancel"), null)
                      .show()
              }

              private fun info(act: Activity, title: String, text: String) {
                  val en = isEn(act)
                  builder(act).setTitle(title).setMessage(text).setPositiveButton(tx(en, "Tamam", "OK"), null).show()
              }

              // ---------- main menu ----------

              fun show(act: Activity) {
                  val en = isEn(act)
                  val items = arrayOf(
                      tx(en, "Zamanlı rutinler", "Scheduled routines") + " (" + Routines.load(act).size + ")",
                      tx(en, "Belgelerim (PDF ile sohbet)", "My documents (chat with PDFs)") + " (" + Docs.list(act).size + ")",
                      tx(en, "Canlı çeviri", "Live interpreter"),
                      tx(en, "Akıllı ev", "Smart home"),
                      tx(en, "Kullanım ve maliyet", "Usage and cost"),
                      tx(en, "Görsel üretim ayarları", "Image generation settings")
                  )
                  builder(act).setTitle(tx(en, "Daha fazlası", "More"))
                      .setItems(items) { _, which ->
