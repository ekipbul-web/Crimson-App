                  logTv = TextView(act).apply {
                      textSize = 15f
                      setTextColor(Color.parseColor("#F4E7E9"))
                      setTextIsSelectable(true)
                  }
                  scroll = ScrollView(act)
                  scroll.addView(logTv)
                  root.addView(scroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(220)).apply {
                      topMargin = dp(8)
