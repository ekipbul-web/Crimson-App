              private fun applyLang() {
                  langPill.text = lang.uppercase()
                  voicePill.text = if (voiceOn) l.voiceOn else l.voiceOff
                  chatPill.text = if (loop) l.chatOn else l.chatOff
                  settingsPill.text = l.settings
                  input.hint = l.hint
                  styled(langPill, true)
                  styled(voicePill, voiceOn)
                  styled(chatPill, loop)
                  styled(settingsPill, false)
                  setState(state)
                  if (ttsReady) applyTtsLang()
              }

              private fun setState(s: St) {
                  state = s
                  val listening = s == St.LISTENING
                  statusView.text = when (s) {
                      St.IDLE -> l.idle
                      St.LISTENING -> l.listening
                      St.THINKING -> l.thinking
                      St.SPEAKING -> l.speaking
                  }
                  statusView.setTextColor(if (listening) AMBER else CYAN)
                  orb.color = if (listening) AMBER else CYAN
                  orb.speaking = s == St.SPEAKING
                  orb.speed = when (s) {
                      St.IDLE -> 1f
                      St.LISTENING -> 1.8f
                      St.THINKING -> 4f
                      St.SPEAKING -> 1.5f
                  }
                  orb.pulseSpeed = when (s) {
                      St.IDLE -> 1f
                      St.LISTENING -> 2f
                      St.THINKING -> 2.5f
                      St.SPEAKING -> 3.5f
                  }
                  micBtn.background = btnBg(if (listening) AMBER else null, if (listening) AMBER else CYAN_DIM)
                  micBtn.setColorFilter(if (listening) Color.parseColor("#1A1000") else CYAN)
              }

