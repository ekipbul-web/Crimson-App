                      noteView.visibility = View.GONE
                  } else {
                      noteView.text = text
                      noteView.visibility = View.VISIBLE
                  }
              }

              private fun addBubble(text: String, mine: Boolean): TextView {
                  val side = if (mine) Gravity.END else Gravity.START
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val label = TextView(this).apply {
                      this.text = if (mine) (if (lang == "en") "YOU" else "SEN") else "JARVİS"
                      textSize = 10f
                      letterSpacing = 0.2f
                      typeface = Typeface.MONOSPACE
                      setTextColor(if (mine) MUTE else CYAN_SOFT)
                  }
                  col.addView(label, LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = side
                      bottomMargin = dp(3)
                  })

                  val r = dp(16).toFloat()
                  val s = dp(4).toFloat()
                  val tv = TextView(this).apply {
                      this.text = text
                      textSize = 16f
                      setTextColor(if (mine) Color.WHITE else FG)
                      setPadding(dp(13), dp(9), dp(13), dp(9))
                      background = GradientDrawable().apply {
                          cornerRadii = if (mine) {
                              floatArrayOf(r, r, r, r, s, s, r, r)
                          } else {
                              floatArrayOf(r, r, r, r, r, r, s, s)
                          }
                          setColor(if (mine) CYAN_DIM else PANEL)
                          if (!mine) setStroke(dp(1), LINE)
                      }
                      maxWidth = (resources.displayMetrics.widthPixels * 0.84f).toInt()
                      setTextIsSelectable(true)
                  }
                  col.addView(tv, LinearLayout.LayoutParams(wrapP, wrapP).apply { gravity = side })

                  log.addView(col, LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = side
                      bottomMargin = dp(12)
                  })
                  scrollDown()
                  return tv
              }

              /** A small system line such as "› SET_ALARM", placed above the pending answer. */
              private fun addToolLine(name: String, error: String? = null) {
                  val tv = TextView(this).apply {
                      text = "› " + name.uppercase(Locale.ROOT) + (if (error != null) "  ✗ " + error else "")
                      textSize = 11f
                      letterSpacing = 0.12f
                      typeface = Typeface.MONOSPACE
                      setTextColor(if (error != null) DANGER else MUTE)
                  }
                  log.addView(tv, maxOf(0, log.childCount - 1), LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = Gravity.START
                      bottomMargin = dp(8)
                  })
                  scrollDown()
              }

              private fun startDots(tv: TextView) {
                  stopDots()
                  val frames = arrayOf("●··", "●●·", "●●●")
                  var i = 0
                  tv.typeface = Typeface.MONOSPACE
                  val r = object : Runnable {
                      override fun run() {
                          tv.text = frames[i % 3]
                          i++
                          ui.postDelayed(this, 350)
                      }
                  }
                  dots = r
                  r.run()
              }

              private fun stopDots() {
                  dots?.let { ui.removeCallbacks(it) }
                  dots = null
              }

              private fun finishBubble(tv: TextView, text: String) {
                  stopDots()
                  tv.typeface = Typeface.DEFAULT
                  tv.text = text
              }

              private fun scrollDown() {
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

