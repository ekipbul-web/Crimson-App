              // ---------- routines ----------

              private fun routines(act: Activity) {
                  val en = isEn(act)
                  val list = Routines.load(act)
                  val rows = ArrayList<String>()
                  val acts = ArrayList<() -> Unit>()
                  rows.add("＋ " + tx(en, "Yeni rutin", "New routine"))
                  acts.add { newRoutine(act) }
