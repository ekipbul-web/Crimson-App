          )

          val EN = L(
              rec = "en-US",
              idle = "READY",
              listening = "LISTENING",
              thinking = "THINKING",
              speaking = "SPEAKING",
              hello = "Hello, I'm JARVIS. Ask me the time, have me take a note, or just chat.",
              hint = "Type or tap the mic",
              voiceOn = "VOICE ON",
              voiceOff = "VOICE OFF",
