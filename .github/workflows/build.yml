          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'JARVIS_EOF_17'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_mono" />
          </adaptive-icon>
          JARVIS_EOF_17

      - name: Keep the generated sources for the release job
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-src
          path: |
            settings.gradle.kts
            build.gradle.kts
            app/build.gradle.kts
            app/src
          if-no-files-found: error
          retention-days: 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Runs only for tags that start with v. Needs these repository secrets:
  #   KEYSTORE_BASE64   the .jks file, base64 encoded
  #   KEYSTORE_PASSWORD password of the keystore
  #   KEY_ALIAS         alias of the key
  #   KEY_PASSWORD      password of the key
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-src

      - name: Check the signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_AL" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Version name from the tag
        id: ver
        run: echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode the keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Release APK not found (is it unsigned?)"; ls -R app/build/outputs/apk; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Keep the AAB for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Package the APK and its checksum
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/Crimson-${TAG}.apk"
          (cd out && sha256sum "Crimson-${TAG}.apk" > "Crimson-${TAG}.apk.sha256")

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Crimson $TAG" --generate-notes --verify-tag $FLAGS
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
