                  val checked = BooleanArray(7)
                  builder(act).setTitle(tx(en, "Hangi günler? (hiçbiri = her gün)", "Which days? (none = every day)"))
                      .setMultiChoiceItems(names, checked) { _, which, isChecked -> checked[which] = isChecked }
                      .setPositiveButton(tx(en, "Kaydet", "Save")) { _, _ ->
