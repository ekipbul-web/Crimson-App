              <path
                  android:fillColor="#FFFFFFFF"
                  android:fillType="evenOdd"
                  android:pathData="M12,2A10,10 0 1,0 12,22A10,10 0 1,0 12,2ZM12,5A7,7 0 1,1 12,19A7,7 0 1,1 12,5ZM12,9A3,3 0 1,0 12,15A3,3 0 1,0 12,9Z" />
          </vector>
          JARVIS_EOF_6
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'JARVIS_EOF_7'
