          package app.jarvis

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.Locale

          /** A plug or light reached with a plain web address (Shelly, Tasker, IFTTT, a custom bridge...). */
          class Hook(val name: String, val on: String, val off: String, val toggle: String)

          /**
           * Smart home control. Two ways: the Home Assistant REST API (lights, plugs, fans, scenes are found by name)
           * and webhook devices that the user adds by hand. Doors, garages and locks are deliberately not supported.
           */
          object Home {
              private class Dev(val domain: String, val entity: String, val name: String)

              private val DOMAINS = setOf("light", "switch", "input_boolean", "fan", "cover", "scene", "script")
              private val BLOCKED_CLASSES = setOf("garage", "gate", "door", "garage_door")

              @Volatile
              private var cached: List<Dev> = emptyList()

              @Volatile
              private var cachedAt = 0L

              private fun prefs(ctx: Context): SharedPreferences = ctx.getSharedPreferences("jarvis", Context.MODE_PRIVATE)

              private fun nk(s: String): String = s.replace('İ', 'i').lowercase(Locale.ROOT)
                  .replace('ı', 'i').replace('ş', 's').replace('ç', 'c')
                  .replace('ğ', 'g').replace('ö', 'o').replace('ü', 'u')
                  .filter { it.isLetterOrDigit() }

              // ---------- settings ----------

              fun haUrl(ctx: Context): String {
                  var u = (prefs(ctx).getString("ha_url", "") ?: "").trim().trimEnd('/')
                  if (u.isNotEmpty() && !u.startsWith("http://") && !u.startsWith("https://")) u = "http://" + u
                  return u
              }

              fun haToken(ctx: Context): String = Secrets.get(prefs(ctx), "ha_token").trim()

              fun haConfigured(ctx: Context): Boolean = haUrl(ctx).isNotEmpty() && haToken(ctx).isNotEmpty()

              fun hooks(ctx: Context): MutableList<Hook> {
                  val out = ArrayList<Hook>()
                  try {
                      val arr = JSONArray(prefs(ctx).getString("webhooks", "[]") ?: "[]")
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Hook(o.optString("name"), o.optString("on"), o.optString("off"), o.optString("toggle")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              fun saveHooks(ctx: Context, list: List<Hook>) {
                  val arr = JSONArray()
                  for (h in list) {
                      arr.put(JSONObject().put("name", h.name).put("on", h.on).put("off", h.off).put("toggle", h.toggle))
                  }
                  prefs(ctx).edit().putString("webhooks", arr.toString()).apply()
              }

              fun configured(ctx: Context): Boolean = haConfigured(ctx) || hooks(ctx).isNotEmpty()

              // ---------- Home Assistant ----------

              private fun auth(ctx: Context): Map<String, String> = mapOf("Authorization" to ("Bearer " + haToken(ctx)))

              private fun states(ctx: Context, force: Boolean): List<Dev> {
                  val now = System.currentTimeMillis()
                  if (!force && cached.isNotEmpty() && now - cachedAt < 45000L) return cached
                  val text = Net.get(haUrl(ctx) + "/api/states", auth(ctx), 15000)
                  val arr = JSONArray(text)
                  val out = ArrayList<Dev>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val entity = o.optString("entity_id")
                      val domain = entity.substringBefore(".")
                      if (domain !in DOMAINS) continue
                      val attrs = o.optJSONObject("attributes")
                      val cls = attrs?.optString("device_class").orEmpty()
                      if (domain == "cover" && cls in BLOCKED_CLASSES) continue
                      val name = attrs?.optString("friendly_name").orEmpty().ifEmpty { entity }
                      out.add(Dev(domain, entity, name))
                  }
                  cached = out
                  cachedAt = now
                  return out
              }

              /** For the settings screen: connects once and says what was found. */
              fun test(ctx: Context): String {
                  val en = isEn(ctx)
                  if (!haConfigured(ctx)) return tx(en, "Home Assistant adresi ve token girilmemiş.", "Home Assistant address and token are not set.")
                  return try {
                      val list = states(ctx, true)
                      tx(en, "Bağlandı. ", "Connected. ") + list.size + tx(en, " cihaz bulundu.", " devices found.")
                  } catch (e: ApiError) {
                      if (e.code == 401) tx(en, "Token reddedildi (401).", "The token was rejected (401).") else "HTTP " + e.code
                  } catch (e: Exception) {
                      tx(en, "Bağlanılamadı: ", "Could not connect: ") + e.javaClass.simpleName + " " + e.message.orEmpty().take(80)
                  }
              }

              fun list(ctx: Context): String {
                  val sb = StringBuilder()
                  for (h in hooks(ctx)) sb.append("- ").append(h.name).append(" (webhook: on/off").append(if (h.toggle.isNotEmpty()) "/toggle" else "").append(")\n")
                  if (haConfigured(ctx)) {
                      try {
                          for (d in states(ctx, false).take(60)) sb.append("- ").append(d.name).append(" (").append(d.domain).append(")\n")
