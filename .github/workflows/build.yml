              private fun pickDocs(act: Activity) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.putExtra(
                      Intent.EXTRA_MIME_TYPES,
                      arrayOf("application/pdf", "text/plain", "text/markdown", "text/csv", "application/json")
                  )
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  try {
                      act.startActivityForResult(i, 10)
                  } catch (e: Exception) {
                      toast(act, tx(isEn(act), "Dosya seçici açılamadı.", "Could not open the file picker."))
                  }
              }

              /** Called from onActivityResult with request code 10. */
              fun onDocsPicked(act: Activity, data: Intent) {
                  val en = isEn(act)
                  val uris = ArrayList<Uri>()
                  val clip = data.clipData
                  if (clip != null) {
                      for (i in 0 until clip.itemCount) uris.add(clip.getItemAt(i).uri)
                  } else if (data.data != null) {
                      uris.add(data.data!!)
                  }
                  if (uris.isEmpty()) return
                  toast(act, tx(en, "Belgeler okunuyor, biraz sürebilir…", "Reading the documents, this can take a while…"))
                  exec.execute {
                      val lines = Docs.importAll(act, uris) { msg ->
                          act.runOnUiThread { Toast.makeText(act, msg, Toast.LENGTH_SHORT).show() }
                      }
                      act.runOnUiThread {
                          try {
                              info(act, tx(en, "Belgeler", "Documents"), lines.joinToString("\n"))
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

