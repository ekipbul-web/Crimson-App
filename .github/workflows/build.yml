          package app.jarvis

          import android.content.SharedPreferences
          import android.graphics.Color
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** Every outside address the app can open. */
          object Links {
              const val SUPPORT = "https://donate.bynogame.com/crimson"
              const val TELEGRAM = "https://t.me/+ExCaZUzHODQxMjZi"
              const val INSTAGRAM = "https://www.instagram.com/tuncayskay"
              const val SITE = "https://crimson-hroc.onrender.com"
              const val PRIVACY = "https://crimson-hroc.onrender.com/privacy.html"
              const val REPO = "https://github.com/ekipbul-web/Crimson-App"
              const val ISSUES = "https://github.com/ekipbul-web/Crimson-App/issues/new"
              const val RELEASES = "https://github.com/ekipbul-web/Crimson-App/releases/latest"
              const val LATEST_API = "https://api.github.com/repos/ekipbul-web/Crimson-App/releases/latest"
          }

          /** API keys are stored encrypted with a key that never leaves the Android Keystore. */
          object Secrets {
              private const val ALIAS = "crimson_secrets_v1"
              private const val PFX = "enc1:"

              fun isSecret(name: String): Boolean = name == "api_key" || name.startsWith("key_") || name == "ha_token"

              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore")
                  ks.load(null)
                  val existing = ks.getKey(ALIAS, null)
                  if (existing is SecretKey) return existing
                  val gen = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  gen.init(
                      KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return gen.generateKey()
              }

              fun enc(plain: String): String {
                  if (plain.isEmpty()) return ""
                  return try {
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.ENCRYPT_MODE, key())
                      val ct = c.doFinal(plain.toByteArray(Charsets.UTF_8))
                      PFX + Base64.encodeToString(c.iv + ct, Base64.NO_WRAP)
                  } catch (e: Exception) {
                      plain
                  }
              }

              fun dec(stored: String): String {
                  if (!stored.startsWith(PFX)) return stored
                  return try {
                      val raw = Base64.decode(stored.substring(PFX.length), Base64.NO_WRAP)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, raw.copyOfRange(0, 12)))
                      String(c.doFinal(raw, 12, raw.size - 12), Charsets.UTF_8)
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun get(p: SharedPreferences, name: String): String = dec(p.getString(name, "") ?: "")

              fun put(ed: SharedPreferences.Editor, name: String, value: String): SharedPreferences.Editor =
                  ed.putString(name, enc(value))

              /** Encrypts keys saved by older versions in plain text. */
              fun migrate(p: SharedPreferences) {
                  val ed = p.edit()
                  var changed = false
                  for ((k, v) in p.all) {
                      if (isSecret(k) && v is String && v.isNotEmpty() && !v.startsWith(PFX)) {
                          val e = enc(v)
                          if (e.startsWith(PFX)) {
                              ed.putString(k, e)
                              changed = true
                          }
                      }
                  }
                  if (changed) ed.apply()
              }

              fun wipe() {
                  try {
                      val ks = KeyStore.getInstance("AndroidKeyStore")
                      ks.load(null)
                      ks.deleteEntry(ALIAS)
                  } catch (e: Exception) {
                  }
              }
          }

          /** Accent colour choices. The dark surfaces stay the same. */
          object Pal {
              class Theme(val id: String, val tr: String, val en: String, val accent: Int, val soft: Int, val dim: Int)

              val themes: List<Theme> = listOf(
                  Theme("red", "Kan kırmızısı", "Blood red", Color.parseColor("#E5233A"), Color.parseColor("#FF6B7B"), Color.parseColor("#8A0F1E")),
                  Theme("blue", "Okyanus mavisi", "Ocean blue", Color.parseColor("#2F8CFF"), Color.parseColor("#7DB6FF"), Color.parseColor("#154C99")),
                  Theme("green", "Zümrüt yeşili", "Emerald", Color.parseColor("#1FBF75"), Color.parseColor("#6FE0A8"), Color.parseColor("#0F6B42")),
                  Theme("purple", "Mor", "Violet", Color.parseColor("#9B5CF5"), Color.parseColor("#C7A2FF"), Color.parseColor("#52299A")),
                  Theme("orange", "Turuncu", "Orange", Color.parseColor("#FF8A1F"), Color.parseColor("#FFB366"), Color.parseColor("#9A4F0B"))
              )

              var accent: Int = themes[0].accent
              var soft: Int = themes[0].soft
              var dim: Int = themes[0].dim

              val tint: Int get() = (accent and 0x00FFFFFF) or 0x26000000
              val glow: Int get() = (accent and 0x00FFFFFF) or 0x33000000
              val glow0: Int get() = accent and 0x00FFFFFF

              fun current(p: SharedPreferences): Theme {
                  val id = p.getString("theme", "red")
                  return themes.firstOrNull { it.id == id } ?: themes[0]
              }

              fun load(p: SharedPreferences) {
                  val t = current(p)
                  accent = t.accent
                  soft = t.soft
                  dim = t.dim
              }
          }

          /** Settings and chats as a JSON file. API keys are never included. */
          object Backup {
              fun export(p: SharedPreferences): String {
                  val data = JSONObject()
                  for ((k, v) in p.all) {
                      if (Secrets.isSecret(k) || k == "last_error" || k == "app_lock") continue
                      val o = JSONObject()
                      when (v) {
                          is String -> o.put("t", "s").put("v", v)
                          is Int -> o.put("t", "i").put("v", v)
                          is Long -> o.put("t", "l").put("v", v)
                          is Boolean -> o.put("t", "b").put("v", v)
                          is Float -> o.put("t", "f").put("v", v.toDouble())
                          is Set<*> -> {
                              val arr = JSONArray()
                              for (x in v) arr.put(x.toString())
                              o.put("t", "a").put("v", arr)
                          }
                          else -> continue
                      }
                      data.put(k, o)
                  }
                  return JSONObject().put("app", "crimson").put("v", 1).put("data", data).toString(2)
              }

              /** Returns how many settings were restored, or -1 if the file is not a Crimson backup. */
              fun restore(p: SharedPreferences, text: String): Int {
                  return try {
                      val root = JSONObject(text)
                      if (root.optString("app") != "crimson") return -1
                      val data = root.getJSONObject("data")
                      val ed = p.edit()
                      var n = 0
                      val keys = data.keys()
                      while (keys.hasNext()) {
                          val k = keys.next()
                          if (Secrets.isSecret(k) || k == "app_lock") continue
                          val o = data.getJSONObject(k)
                          when (o.getString("t")) {
                              "s" -> ed.putString(k, o.getString("v"))
                              "i" -> ed.putInt(k, o.getInt("v"))
                              "l" -> ed.putLong(k, o.getLong("v"))
                              "b" -> ed.putBoolean(k, o.getBoolean("v"))
                              "f" -> ed.putFloat(k, o.getDouble("v").toFloat())
                              "a" -> {
                                  val arr = o.getJSONArray("v")
                                  val set = HashSet<String>()
                                  for (i in 0 until arr.length()) set.add(arr.getString(i))
                                  ed.putStringSet(k, set)
                              }
                              else -> continue
                          }
                          n++
                      }
                      ed.apply()
                      n
                  } catch (e: Exception) {
                      -1
                  }
              }
          }

          /** Looks for a newer release on GitHub. Runs only when the user asks. */
          object Updates {
              class Info(val tag: String, val url: String)

              fun latest(): Info? {
                  return try {
                      val c = URL(Links.LATEST_API).openConnection() as HttpURLConnection
                      c.connectTimeout = 8000
                      c.readTimeout = 8000
                      c.setRequestProperty("Accept", "application/vnd.github+json")
                      c.setRequestProperty("User-Agent", "Crimson-Android")
                      val result = if (c.responseCode == 200) {
                          val o = JSONObject(c.inputStream.bufferedReader().use { it.readText() })
                          Info(o.optString("tag_name"), o.optString("html_url", Links.RELEASES))
                      } else {
                          null
                      }
                      c.disconnect()
                      result
                  } catch (e: Exception) {
                      null
                  }
              }

              fun isNewer(latest: String, current: String): Boolean {
                  fun parts(s: String): List<Int> =
                      s.trim().trimStart('v', 'V').split('.', '-').map { it.toIntOrNull() ?: 0 }
                  val a = parts(latest)
                  val b = parts(current)
                  for (i in 0 until maxOf(a.size, b.size)) {
                      val x = a.getOrElse(i) { 0 }
                      val y = b.getOrElse(i) { 0 }
                      if (x != y) return x > y
                  }
                  return false
              }
          }
