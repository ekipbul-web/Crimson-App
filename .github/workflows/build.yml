                  picks.addView(pickA, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  picks.addView(pickB, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(picks)

                  val mics = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL }
                  micA = micButton { startTurn(a, b) }
                  micB = micButton { startTurn(b, a) }
                  mics.addView(micA, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { rightMargin = dp(6) })
                  mics.addView(micB, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = dp(6) })
                  root.addView(mics, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(8)
                  })

                  val box = CheckBox(act).apply {
                      text = tx(en, "Otomatik sıra (çeviriden sonra karşı taraf dinlenir)", "Auto turns (listen to the other person after each translation)")
                      isChecked = true
                      setTextColor(Color.parseColor("#F4E7E9"))
                      textSize = 13f
                      setOnCheckedChangeListener { _, c -> auto = c }
                  }
                  root.addView(box)

                  statusTv = TextView(act).apply {
                      textSize = 13f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.parseColor("#FFB23E"))
                      text = tx(en, "Konuşacak kişinin düğmesine dokun.", "Tap the button of the person who speaks.")
                  }
                  root.addView(statusTv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
