              /** Runs [block] on the UI thread and waits for its result. */
              private fun onUi(block: () -> String): String {
                  val latch = CountDownLatch(1)
                  var out = "error: timeout"
                  runOnUiThread {
                      out = try {
                          block()
                      } catch (e: Exception) {
                          "error: " + e.javaClass.simpleName + " " + e.message.orEmpty().take(80)
                      }
                      latch.countDown()
                  }
                  latch.await(5, TimeUnit.SECONDS)
                  return out
              }

              private fun norm(s: String): String = s.lowercase(Locale.ROOT)
                  .replace('ı', 'i').replace('ş', 's').replace('ç', 'c')
                  .replace('ğ', 'g').replace('ö', 'o').replace('ü', 'u')
                  .filter { it.isLetterOrDigit() }

