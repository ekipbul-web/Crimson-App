                              en,
                              "Sohbetler, notlar, hafıza, rutinler, ayarlar ve API anahtarları bu telefondan silinir. Bu işlem geri alınamaz.",
                              "Chats, notes, memory, routines, settings and API keys will be removed from this phone. This cannot be undone."
                          )
                      )
                      .setPositiveButton(tx(en, "Sil", "Delete")) { _, _ -> wipeAll() }
                      .setNegativeButton(l.cancel, null)
                      .show()
              }

              private fun wipeAll() {
                  stopSpeech()
                  prefs.edit().clear().commit()
                  Secrets.wipe()
                  try {
                      cacheDir.deleteRecursively()
                  } catch (e: Exception) {
                  }
                  Pal.load(prefs)
                  wakeSync()
                  recreate()
              }

              private fun checkUpdate() {
                  val en = lang == "en"
                  note(tx(en, "Güncellemeler denetleniyor…", "Checking for updates…"))
                  Thread {
                      val info = Updates.latest()
                      runOnUiThread {
                          note(null)
                          val cur = versionName()
                          if (info == null) {
                              note(tx(en, "Güncelleme denetlenemedi. İnternetini kontrol et.", "Couldn't check for updates. Check your connection."))
                          } else if (Updates.isNewer(info.tag, cur)) {
                              AlertDialog.Builder(this, R.style.JarvisDialog)
                                  .setTitle(tx(en, "Yeni sürüm var", "New version available"))
                                  .setMessage(info.tag + tx(en, " yayınlandı. Şu an " + cur + " kullanıyorsun.", " is out. You are on " + cur + "."))
                                  .setPositiveButton(tx(en, "İndir", "Download")) { _, _ -> openUrl(info.url) }
                                  .setNegativeButton(l.cancel, null)
                                  .show()
                          } else {
                              note(tx(en, "Crimson güncel (" + cur + ").", "Crimson is up to date (" + cur + ")."))
                          }
                      }
                  }.start()
              }

              private fun issueUrl(): String {
                  val body = "**Sürüm / Version:** " + versionName() +
                      "\n**Android:** " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")" +
                      "\n**Cihaz / Device:** " + Build.MANUFACTURER + " " + Build.MODEL +
                      "\n**Son hata / Last error:** " + (prefs.getString("last_error", "") ?: "") +
                      "\n\n**Ne oldu? / What happened?**\n"
                  return Links.ISSUES + "?title=" + URLEncoder.encode("Sorun: ", "UTF-8") +
                      "&body=" + URLEncoder.encode(body, "UTF-8")
              }

