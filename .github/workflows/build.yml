              private fun setReminder(minutes: Int, text: String): String {
                  return try {
                      val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val id = (System.currentTimeMillis() % 1000000).toInt()
                      val pi = PendingIntent.getBroadcast(
                          this, id, Intent(this, JarvisRemind::class.java).putExtra("text", text),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + minutes * 60000L, pi)
                      "reminder set in " + minutes + " minutes (may be a little late on battery saver)"
                  } catch (e: Exception) {
                      "error: " + e.javaClass.simpleName + " " + e.message.orEmpty().take(80)
                  }
              }

