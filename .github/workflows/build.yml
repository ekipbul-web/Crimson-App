              /** Memories, saved macros, the chosen style and the standing routines are added to the system prompt. */
              private fun extraPrompt(): String {
                  val en = lang == "en"
                  val sb = StringBuilder("\n\n")
                  val mem = loadMem()
                  if (mem.length() > 0) {
                      sb.append(if (en) "What you remember about the user (use it, do not recite it):\n" else "Kullanıcı hakkında hatırladıkların (kullan ama ezbere sayma):\n")
                      for (i in 0 until mem.length()) sb.append("- ").append(mem.getString(i)).append('\n')
                  }
                  val mac = loadMacros()
                  if (mac.length() > 0) {
                      val names = ArrayList<String>()
                      val it = mac.keys()
                      while (it.hasNext()) names.add(it.next())
                      sb.append(if (en) "Saved routines (run with run_macro): " else "Kayıtlı rutinler (run_macro ile çalıştır): ").append(names.joinToString(", ")).append('\n')
                  }
                  val per = personaText()
                  if (per.isNotEmpty()) sb.append(per).append('\n')
                  sb.append(
                      if (en) {
                          "When the user shares a lasting fact about themselves (names, birthdays, where things are, preferences) call remember. " +
                              "For a morning briefing (good morning, daily summary) call get_weather, list_events, list_notes, phone_status and read_notifications, then give a short spoken summary. " +
                              "To translate or summarise what is on screen use screen_read (or see_screen) and answer in the user's language. " +
                              "Use remind for 'remind me in N minutes' requests, and save_macro when the user wants to name a multi-step routine."
                      } else {
                          "Kullanıcı kalıcı bir bilgi verirse (isimler, doğum günleri, eşyaların yeri, tercihler) remember çağır. " +
                              "Sabah özeti istenirse (günaydın, günlük özet) get_weather, list_events, list_notes, phone_status ve read_notifications çağır, sonra kısa ve konuşur gibi özetle. " +
                              "Ekrandaki şeyi çevirmek ya da özetlemek için screen_read (olmazsa see_screen) kullan ve kullanıcının dilinde cevap ver. " +
                              "Birkaç dakika sonra hatırlat denirse remind, çok adımlı bir işe isim verilmek istenirse save_macro kullan."
                      }
                  )
                  sb.append("\n").append(Plus.prompt(this, en))
                  return sb.toString()
              }

