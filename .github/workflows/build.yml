name: Build Crimson APK

# Every push builds a debug APK (artifact). Pushing a tag like v2.1.0 also builds a signed
# release APK and attaches it to the GitHub Releases page. See the secrets listed in the
# "release" job below.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

