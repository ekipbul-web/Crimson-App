              private fun loadAsync(uri: Uri, temp: Boolean) {
                  note(null)
                  worker.execute {
                      try {
                          val a = loadAttachment(uri)
                          runOnUiThread {
                              attach = a
                              updateAttachRow()
                          }
                      } catch (e: Exception) {
                          val m = when (e.message) {
                              "unsupported" -> l.fileNo
                              "toobig" -> l.fileBig
                              else -> l.fail + "\n" + e.javaClass.simpleName
                          }
                          runOnUiThread { note(m) }
                      } finally {
                          if (temp) deleteQuietly(uri)
                      }
                  }
              }

              private fun displayName(uri: Uri): String {
                  var n = "file"
                  contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                      if (c.moveToFirst()) n = c.getString(0) ?: "file"
                  }
                  return n
              }

              private fun loadAttachment(uri: Uri): Attach {
                  val name = displayName(uri)
                  val mime = (contentResolver.getType(uri) ?: "application/octet-stream").lowercase(Locale.ROOT)
                  if (mime.startsWith("image/")) return Attach("image/jpeg", encodePhoto(uri), name, false)
                  if (mime.startsWith("text/") || mime == "application/json") {
                      val txt = contentResolver.openInputStream(uri)?.use { it.bufferedReader().readText() } ?: ""
                      return Attach("text/plain", txt.take(60000), name, true)
                  }
                  if (mime == "application/pdf" || mime.startsWith("audio/")) {
                      val size = contentResolver.openAssetFileDescriptor(uri, "r")?.use { it.length } ?: -1L
                      if (size > 12_000_000L) throw IllegalStateException("toobig")
                      val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: ByteArray(0)
                      if (bytes.size > 12_000_000) throw IllegalStateException("toobig")
                      return Attach(mime, Base64.encodeToString(bytes, Base64.NO_WRAP), name, false)
                  }
                  throw IllegalStateException("unsupported")
              }

              private fun newPhotoUri(): Uri? {
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "jarvis_" + System.currentTimeMillis() + ".jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Crimson")
                  }
                  return contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
              }

              private fun cameraIntent(uri: Uri): Intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                  .putExtra(MediaStore.EXTRA_OUTPUT, uri)
                  .addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)

              private fun deleteQuietly(uri: Uri) {
                  try {
                      contentResolver.delete(uri, null, null)
                  } catch (e: Exception) {
                  }
              }

              // ---------- speech in ----------

              private fun stopListening() {
                  recognizer?.cancel()
                  if (state == St.LISTENING) setState(St.IDLE)
              }

              private fun listen() {
                  if (busy) return
                  if (state == St.LISTENING) {
                      stopListening()
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      note(l.noRecognizer)
                      return
                  }
                  stopSpeech()
                  note(null)

                  recognizer?.destroy()
                  val google = ComponentName(
                      "com.google.android.googlequicksearchbox",
                      "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"
                  )
                  val hasGoogle = try {
                      packageManager.getServiceInfo(google, 0)
                      true
                  } catch (e: Exception) {
                      false
                  }
                  val r = if (hasGoogle) {
                      SpeechRecognizer.createSpeechRecognizer(this, google)
                  } else {
                      SpeechRecognizer.createSpeechRecognizer(this)
                  }
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}

                      override fun onRmsChanged(rmsdB: Float) {
                          orb.pushLevel(((rmsdB + 2f) / 12f).coerceIn(0f, 1f))
                      }

                      override fun onPartialResults(partialResults: Bundle?) {
                          val t = partialResults
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull()
                          if (!t.isNullOrBlank()) input.setText(t)
                      }

                      override fun onResults(results: Bundle?) {
                          val t = results
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull()
                          setState(St.IDLE)
                          if (!t.isNullOrBlank()) {
                              send(t)
                          } else {
                              stopLoop(l.noSpeech)
                          }
                      }

                      override fun onError(error: Int) {
                          setState(St.IDLE)
                          when (error) {
                              SpeechRecognizer.ERROR_NO_MATCH,
                              SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> stopLoop(l.noSpeech)
                              SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> stopLoop(l.micDenied)
                              SpeechRecognizer.ERROR_CLIENT -> {}
                              else -> stopLoop(l.fail)
                          }
                      }
                  })

                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, l.rec)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  }
                  r.startListening(i)
                  setState(St.LISTENING)
              }

              private fun stopLoop(message: String?) {
                  if (loop) {
                      loop = false
                      applyLang()
                  }
                  note(message)
              }

              // ---------- speech out ----------

              private fun applyTtsLang() {
                  tts?.setPitch(0.88f)
                  tts?.setSpeechRate(0.96f)
                  val r = tts?.setLanguage(Locale.forLanguageTag(l.rec))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      note(l.noTts)
                  }
              }

              private fun isCurrent(id: String?): Boolean = id != null && id.startsWith(gen.toString() + ":")

              private fun utterFinished(id: String?) {
                  if (!isCurrent(id)) return
                  if (utterPending > 0) utterPending--
                  if (utterPending == 0 && streamDone) onSpeechDone()
              }

              private fun cloudOn(): Boolean = prefs.getBoolean("cloud_tts", true)

              private fun stopSpeech() {
                  gen++
                  utterPending = 0
                  tts?.stop()
                  try {
                      track?.stop()
                  } catch (e: Exception) {
                  }
              }

              private fun ttsDone(id: String?) {
                  val w = if (id != null) ttsWait.remove(id) else null
                  if (w != null) w.countDown() else runOnUiThread { utterFinished(id) }
              }

              private fun speak(text: String) {
                  val t = text.trim()
                  if (t.isEmpty() || !voiceOn) return
                  val id = gen.toString() + ":" + (utterSeq++)
                  val myGen = gen
                  if (cloudOn() && System.currentTimeMillis() >= cloudBlockedUntil) {
                      utterPending++
                      val fut = synthExec.submit(java.util.concurrent.Callable<ByteArray?> { synth(t) })
                      playExec.execute { playCloud(id, myGen, t, fut) }
                  } else if (ttsReady) {
                      utterPending++
                      tts?.speak(t, TextToSpeech.QUEUE_ADD, null, id)
                  }
              }

              /** Asks Gemini for speech. Returns 24 kHz 16-bit mono PCM, or null when it is not available. */
              private fun synth(text: String): ByteArray? {
                  val engine = prefs.getString("tts_engine", "gemini") ?: "gemini"
                  if (engine != "gemini") return synthOther(engine, text)
                  val voice = prefs.getString("voice_name", "Charon") ?: "Charon"
                  var blockMs = 30000L
                  for (m in TTS_MODELS) {
                      for (f in 0..1) {
                          val form = (ttsForm + f) % 2
                          val voiceCfg = if (form == 0) {
                              JSONObject().put("prebuiltVoiceConfig", JSONObject().put("voiceName", voice))
                          } else {
                              JSONObject().put("voice", voice)
                          }
                          val body = JSONObject()
                              .put(
                                  "contents",
                                  JSONArray().put(
                                      JSONObject().put("role", "user")
                                          .put("parts", JSONArray().put(JSONObject().put("text", text)))
                                  )
                              )
                              .put(
                                  "generationConfig",
                                  JSONObject()
                                      .put("responseModalities", JSONArray().put("AUDIO"))
                                      .put("speechConfig", JSONObject().put("voiceConfig", voiceCfg))
                              )
                          try {
                              val res = post(m, apiKey, body, 30000)
                              val part = res.optJSONArray("candidates")?.optJSONObject(0)
                                  ?.optJSONObject("content")?.optJSONArray("parts")?.optJSONObject(0)
                              val blob = part?.optJSONObject("inlineData") ?: part?.optJSONObject("inline_data")
                              val b64 = blob?.optString("data").orEmpty()
                              if (b64.isNotEmpty()) {
                                  ttsForm = form
                                  Usage.tts("gemini", text.length)
                                  return pcmFrom(Base64.decode(b64, Base64.DEFAULT))
                              }
                          } catch (e: ApiError) {
                              if (e.code == 400) continue
                              blockMs = when (e.code) {
                                  429 -> 60000L
                                  500, 503 -> 20000L
                                  403, 404 -> 600000L
                                  else -> 60000L
                              }
                              break
                          } catch (e: IOException) {
                              blockMs = 30000L
                              break
                          }
                      }
                  }
                  cloudBlockedUntil = System.currentTimeMillis() + blockMs
                  return null
              }

              /** Strips a WAV header when there is one. */
              private fun pcmFrom(b: ByteArray): ByteArray {
                  val isRiff = b.size > 44 && b[0] == 'R'.code.toByte() && b[1] == 'I'.code.toByte() &&
                      b[2] == 'F'.code.toByte() && b[3] == 'F'.code.toByte()
                  if (!isRiff) return b
                  var i = 12
                  while (i + 8 <= b.size) {
                      val tag = String(b, i, 4, Charsets.US_ASCII)
                      val size = (b[i + 4].toInt() and 0xff) or ((b[i + 5].toInt() and 0xff) shl 8) or
                          ((b[i + 6].toInt() and 0xff) shl 16) or ((b[i + 7].toInt() and 0xff) shl 24)
                      if (tag == "data") {
                          val start = i + 8
                          val end = if (size < 0 || start + size > b.size) b.size else start + size
                          return b.copyOfRange(start, end)
                      }
                      if (size < 0) break
                      i += 8 + size + (size and 1)
                  }
                  return b.copyOfRange(44, b.size)
              }

              private fun playCloud(id: String, myGen: Int, text: String, fut: java.util.concurrent.Future<ByteArray?>) {
                  val pcm = try {
                      fut.get(40, TimeUnit.SECONDS)
                  } catch (e: Exception) {
                      null
                  }
                  if (myGen != gen) return
                  runOnUiThread { if (isCurrent(id)) setState(St.SPEAKING) }
                  if (pcm == null || pcm.size < 2) {
                      if (System.currentTimeMillis() - lastFallbackNote > 60000L) {
                          lastFallbackNote = System.currentTimeMillis()
                          runOnUiThread { note(l.ttsFallback) }
                      }
                      if (!ttsReady) {
                          runOnUiThread { utterFinished(id) }
                          return
                      }
                      val latch = CountDownLatch(1)
                      ttsWait[id] = latch
                      tts?.speak(text, TextToSpeech.QUEUE_ADD, null, id)
                      latch.await(30, TimeUnit.SECONDS)
                      ttsWait.remove(id)
                  } else {
                      playPcm(pcm, myGen)
                  }
                  if (myGen != gen) return
                  runOnUiThread { utterFinished(id) }
              }

              private fun playPcm(pcm: ByteArray, myGen: Int) {
                  val at = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(24000)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(pcm.size)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  track = at
                  try {
                      at.write(pcm, 0, pcm.size)
                      val frames = pcm.size / 2
                      at.play()
                      while (myGen == gen && at.playState == AudioTrack.PLAYSTATE_PLAYING &&
                          at.playbackHeadPosition < frames - 240
                      ) {
                          Thread.sleep(40)
                      }
                  } finally {
                      try {
                          at.stop()
                      } catch (e: Exception) {
                      }
                      at.release()
                      if (track === at) track = null
                  }
              }

              /** Speaks every complete sentence that has arrived so far. */
              private fun speakNew(full: String) {
                  if (!voiceOn) return
                  while (spoken < full.length) {
                      var end = -1
                      var i = spoken
                      while (i < full.length) {
                          val ch = full[i]
                          if (ch == '.' || ch == '!' || ch == '?' || ch == '\n') {
                              val atEnd = i + 1 >= full.length
                              val minLen = if (utterSeq == 0) 12 else 28
                              if (((!atEnd && full[i + 1].isWhitespace()) && i + 1 - spoken >= minLen) || ch == '\n') {
                                  end = i + 1
                                  break
                              }
                          }
                          i++
                      }
                      if (end < 0) return
                      speak(full.substring(spoken, end))
                      spoken = end
                  }
              }

              private fun speakRest(full: String) {
                  if (spoken < full.length) speak(full.substring(spoken))
                  spoken = full.length
              }

              private fun onSpeechDone() {
                  if (state == St.SPEAKING) setState(St.IDLE)
                  if (loop && !busy && state == St.IDLE) listen()
              }

              // ---------- Gemini ----------

              private fun send(raw: String) {
                  val typed = raw.trim()
                  val att = attach
                  if ((typed.isEmpty() && att == null) || busy) return
                  val text = if (typed.isEmpty()) l.describe else typed
                  val key = Secrets.get(prefs, "api_key")
                  if (Prov.configured(prefs).isEmpty()) {
                      note(l.needKey)
                      showKeyDialog()
                      return
                  }
                  busy = true
                  hideStartCard()
                  cancelled = false
                  apiKey = key
                  stopSpeech()
                  utterSeq = 0
                  spoken = 0
                  streamDone = false
                  note(null)
                  input.setText("")
                  addBubble(text + (if (att != null) "\n[" + att.name + "]" else ""), true)
                  attach = null
                  updateAttachRow()
                  val pending = addBubble("", false)
                  startDots(pending)
                  setState(St.THINKING)

                  val convo = history.toList() + (("user") to text)
                  val system = l.system + extraPrompt()
                  worker.execute {
                      try {
                          val answer = ask(key, system, convo, att) { shown ->
                              runOnUiThread {
                                  stopDots()
                                  pending.typeface = Typeface.DEFAULT
                                  pending.text = shown
                                  scrollDown()
                                  speakNew(shown)
                              }
                          }
                          runOnUiThread {
                              finishBubble(pending, answer)
                              history.add("user" to (text + (if (att != null) " [attached: " + att.name + "]" else "")))
                              history.add("assistant" to answer)
                              transcript.add("user" to (text + (if (att != null) "\n[" + att.name + "]" else "")))
                              transcript.add("assistant" to answer)
                              saveChat()
                              while (history.size > 12) history.removeAt(0)
                              providerNote()
                              busy = false
                              scrollDown()
                              speakRest(answer)
                              streamDone = true
                              if (utterPending == 0) {
                                  setState(St.IDLE)
                                  onSpeechDone()
                              }
                          }
                      } catch (e: ApiError) {
                          val detail = e.message.orEmpty()
                          val badKey = e.code == 401 || e.code == 403 ||
                              detail.contains("API_KEY_INVALID") || detail.contains("API key not valid")
                          val m = when {
                              badKey -> l.badKey
                              e.code == 429 -> l.rate
                              e.code == 503 -> l.busy
                              else -> l.fail + "\n" + apiDetail(e)
                          }
                          showError(pending, m)
                      } catch (e: IOException) {
                          showError(pending, l.offline + "\n" + e.javaClass.simpleName + ": " + e.message.orEmpty().take(200))
                      } catch (e: Exception) {
                          showError(pending, l.fail + "\n" + e.javaClass.simpleName + ": " + e.message.orEmpty().take(200))
                      }
                  }
              }

              private fun apiDetail(e: ApiError): String {
                  val raw = e.message.orEmpty()
                  val msg = try {
                      JSONObject(raw.substring(raw.indexOf('{'))).optJSONObject("error")?.optString("message").orEmpty()
                  } catch (x: Exception) {
                      ""
                  }
                  val text = if (msg.isNotEmpty()) msg else raw
                  return "HTTP " + e.code + ": " + text.take(240)
              }

              private fun showError(bubble: TextView, message: String) {
                  runOnUiThread {
                      stopSpeech()
                      streamDone = true
                      finishBubble(bubble, message + hintFor(message))
                      prefs.edit().putString("last_error", message.take(300)).apply()
                      bubble.setTextColor(DANGER)
                      busy = false
                      loop = false
                      applyLang()
                      setState(St.IDLE)
                      scrollDown()
                  }
              }

              private fun markDown(m: String, ms: Long) {
                  modelDownUntil[m] = System.currentTimeMillis() + ms
              }

              private fun markFailure(m: String, code: Int) {
                  when (code) {
                      404 -> markDown(m, 6 * 3600_000L)
                      429, 500, 503 -> markDown(m, 45_000L)
                  }
              }

              /** Models worth trying now: the last good one first, models that just failed skipped. */
              private fun modelOrder(list: List<String>, sticky: Boolean): List<String> {
                  val now = System.currentTimeMillis()
                  val good = lastGoodModel
                  val ordered = if (sticky && good != null && good in list) listOf(good) + list.filter { it != good } else list
                  val up = ordered.filter { (modelDownUntil[it] ?: 0L) <= now }
                  return if (up.isEmpty()) ordered else up
              }

              private fun ask(
                  key: String,
                  system: String,
                  convo: List<Pair<String, String>>,
                  att: Attach?,
                  onText: (String) -> Unit
              ): String {
                  var last: Exception? = null
                  val tools = toolDecls()
                  val started = toolCount
                  for (p in Prov.order(prefs)) {
                      try {
                          val out = if (p == Prov.GEMINI) {
                              askGemini(Prov.key(prefs, p), system, convo, att, onText)
                          } else {
                              Llm.run(
                                  p, Prov.key(prefs, p), Prov.model(prefs, p), system, convo, att, tools,
                                  { cancelled }, { n, a -> runTool(n, a) }, l.stopped, onText
                              )
                          }
                          usedProv = p
                          return out
                      } catch (e: ApiError) {
                          last = e
                          Health.markFailure(p, e.code)
                      } catch (e: IOException) {
                          last = e
                          Health.markDown(p, 30_000L)
                      }
                      // Once a tool has acted on the phone, never replay the request on another provider.
                      if (toolCount != started || cancelled) break
                  }
                  throw last ?: IllegalStateException("no provider")
              }


              private fun askGemini(
                  key: String,
                  system: String,
                  convo: List<Pair<String, String>>,
                  att: Attach?,
                  onText: (String) -> Unit
              ): String {
                  var last: Exception? = null
                  for (m in modelOrder(MODELS, true)) {
                      for (think in listOf(true, false)) {
                          try {
                              val out = askWith(m, think, key, system, convo, att, onText)
                              lastGoodModel = m
                              return out
                          } catch (e: ApiError) {
                              last = e
                              // A 400 may mean this model rejects the thinking setting: retry it without.
                              if (e.code == 400 && think) continue
                              if (e.code == 503 || e.code == 429 || e.code == 500 || e.code == 404) {
                                  markFailure(m, e.code)
                                  break
                              }
                              throw e
                          } catch (e: SocketTimeoutException) {
                              last = ApiError(503, "timeout")
                              markDown(m, 30_000L)
                              break
                          }
                      }
                  }
                  throw last ?: IllegalStateException("no model")
              }

              private fun askWith(
                  model: String,
                  think: Boolean,
                  key: String,
                  system: String,
                  convo: List<Pair<String, String>>,
                  att: Attach?,
                  onText: (String) -> Unit
              ): String {
                  val contents = JSONArray()
                  for ((idx, pair) in convo.withIndex()) {
                      val role = pair.first
                      val parts = JSONArray().put(JSONObject().put("text", pair.second))
                      if (att != null && idx == convo.size - 1 && role == "user") {
                          if (att.isText) {
                              parts.put(JSONObject().put("text", "[File: " + att.name + "]\n" + att.data))
                          } else {
                              parts.put(
                                  JSONObject().put(
                                      "inline_data",
                                      JSONObject().put("mime_type", att.mime).put("data", att.data)
                                  )
                              )
                          }
                      }
                      contents.put(
                          JSONObject()
                              .put("role", if (role == "assistant") "model" else "user")
                              .put("parts", parts)
                      )
                  }
                  val total = StringBuilder()
                  for (round in 0 until 24) {
                      if (cancelled) {
                          val t = total.toString().trim()
                          return if (t.isEmpty()) l.stopped else t
                      }
                      val body = JSONObject()
                          .put(
                              "systemInstruction",
                              JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system)))
                          )
                          .put("contents", contents)
                          .put("tools", JSONArray().put(JSONObject().put("functionDeclarations", toolDecls())))
                      if (think && model.startsWith("gemini-3")) {
                          body.put(
                              "generationConfig",
                              JSONObject().put("thinkingConfig", JSONObject().put("thinkingLevel", "low"))
                          )
                      }

                      val allParts = JSONArray()
                      val calls = ArrayList<JSONObject>()
                      val roundText = StringBuilder()
                      var gIn = 0L
                      var gOut = 0L
                      postStream(model, key, body, if (att != null) 40000 else 12000) { chunk ->
                          val um = chunk.optJSONObject("usageMetadata")
                          if (um != null) {
                              gIn = um.optLong("promptTokenCount", gIn)
                              gOut = um.optLong("candidatesTokenCount", 0L) + um.optLong("thoughtsTokenCount", 0L)
                          }
                          val parts = chunk.optJSONArray("candidates")?.optJSONObject(0)
                              ?.optJSONObject("content")?.optJSONArray("parts")
                          if (parts != null) {
                              for (i in 0 until parts.length()) {
                                  val p = parts.getJSONObject(i)
                                  allParts.put(p)
                                  val fc = p.optJSONObject("functionCall")
                                  if (fc != null) {
                                      calls.add(fc)
                                  } else if (p.has("text") && !p.optBoolean("thought", false)) {
                                      roundText.append(p.optString("text"))
                                      onText((total.toString() + roundText.toString()).trimStart())
                                  }
                              }
                          }
                      }
                      total.append(roundText)
                      Usage.llm(
                          Prov.GEMINI, model,
                          if (gIn > 0L) gIn else (system.length / 4 + 1).toLong(),
                          if (gOut > 0L) gOut else Usage.estimateTokens(roundText.toString())
                      )
                      if (calls.isEmpty()) {
                          val out = total.toString().trim()
                          return if (out.isEmpty()) "…" else out
                      }

                      // Echo the model turn exactly as returned, so Gemini keeps its thought signatures.
                      contents.put(JSONObject().put("role", "model").put("parts", allParts))
                      val answers = JSONArray()
                      var shortcut: String? = null
                      for (fc in calls) {
                          val name = fc.getString("name")
                          val out = runTool(name, fc.optJSONObject("args") ?: JSONObject())
                          if (calls.size == 1 && (name == "search_web" || name == "look") && !out.startsWith("error")) {
                              shortcut = out
                          }
                          val fr = JSONObject().put("name", name).put("response", JSONObject().put("result", out))
                          if (fc.has("id")) fr.put("id", fc.getString("id"))
                          answers.put(JSONObject().put("functionResponse", fr))
                      }
                      if (shortcut != null) {
                          val base = total.toString().trim()
                          val full = if (base.isEmpty()) shortcut else base + " " + shortcut
                          onText(full)
                          return full
                      }
                      contents.put(JSONObject().put("role", "user").put("parts", answers))
                  }
                  return "…"
              }

              /** Streams a generateContent call; [onChunk] gets each JSON event as it arrives. */
              private fun postStream(
                  model: String,
                  key: String,
                  body: JSONObject,
                  readMs: Int,
                  onChunk: (JSONObject) -> Unit
              ) {
                  val url = "https://generativelanguage.googleapis.com/v1beta/models/" + model +
                      ":streamGenerateContent?alt=sse"
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = readMs
                      conn.doOutput = true
                      conn.setRequestProperty("content-type", "application/json")
                      conn.setRequestProperty("x-goog-api-key", key)
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = conn.responseCode
                      if (code !in 200..299) {
                          val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                          throw ApiError(code, err)
                      }
                      conn.inputStream.bufferedReader().use { br ->
                          var line = br.readLine()
                          while (line != null) {
                              if (line.startsWith("data:")) {
                                  val json = line.substring(5).trim()
                                  if (json.isNotEmpty()) {
                                      val obj = try {
                                          JSONObject(json)
                                      } catch (e: org.json.JSONException) {
                                          null
                                      }
                                      if (obj != null) onChunk(obj)
                                  }
                              }
                              line = br.readLine()
                          }
                      }
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun post(model: String, key: String, body: JSONObject, readMs: Int = 15000): JSONObject {
                  val url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent"
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = readMs
                      conn.doOutput = true
                      conn.setRequestProperty("content-type", "application/json")
                      conn.setRequestProperty("x-goog-api-key", key)
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw ApiError(code, text)
                      val obj = JSONObject(text)
                      if (!model.contains("tts")) Usage.fromGemini(model, obj)
                      return obj
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun httpGet(url: String): String {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.connectTimeout = 8000
                      conn.readTimeout = 10000
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) Crimson")
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw IOException("HTTP " + code)
                      return text
                  } finally {
                      conn.disconnect()
                  }
              }

