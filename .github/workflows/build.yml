          package app.jarvis

          import android.app.Activity
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          /** Hub for the newer abilities: tool declarations, tool dispatch and the extra system prompt. */
          object Plus {
              /** Set by the chat screen so generated pictures can be shown. Arguments: file path, gallery uri or null. */
              @Volatile
              var imageSink: ((String, String?) -> Unit)? = null

              fun p(type: String, desc: String): JSONObject = JSONObject().put("type", type).put("description", desc)

              fun decl(name: String, desc: String, props: JSONObject?, required: List<String>): JSONObject {
                  val o = JSONObject().put("name", name).put("description", desc)
                  if (props != null) {
                      val req = JSONArray()
                      for (r in required) req.put(r)
                      o.put("parameters", JSONObject().put("type", "object").put("properties", props).put("required", req))
                  }
                  return o
              }

              fun addHomeDecls(a: JSONArray) {
                  a.put(
                      decl(
                          "smart_home",
                          "Controls a smart home device (light, plug, fan, scene) by its name. Not for doors, garages or locks.",
                          JSONObject()
                              .put("device", p("string", "Device name as the user says it, for example living room light"))
                              .put("action", p("string", "on, off, toggle, status or set"))
                              .put("value", p("integer", "Optional 1 to 100: brightness for lights, speed for fans")),
                          listOf("device", "action")
                      )
                  )
                  a.put(decl("list_devices", "Lists the smart home devices Crimson can control.", null, emptyList()))
              }

              fun addDocDecls(a: JSONArray) {
                  a.put(
                      decl(
                          "search_docs",
                          "Searches the user's uploaded documents (PDF and text) and returns the best passages with file name and page.",
                          JSONObject()
                              .put("query", p("string", "Keywords, in the language of the documents"))
                              .put("file", p("string", "Optional: only search the file whose name contains this")),
                          listOf("query")
                      )
                  )
                  a.put(
                      decl(
                          "read_doc",
                          "Reads a few pages of one uploaded document, for summaries or exact wording.",
                          JSONObject()
                              .put("file", p("string", "File name or part of it"))
                              .put("from_page", p("integer", "First page, default 1"))
                              .put("to_page", p("integer", "Last page, at most 8 pages after the first")),
                          listOf("file")
                      )
                  )
                  a.put(decl("list_docs", "Lists the uploaded documents.", null, emptyList()))
              }

              fun decls(base: JSONArray): JSONArray {
                  base.put(
                      decl(
                          "generate_image",
                          "Draws a picture from a description with an AI image model and shows it in the chat.",
                          JSONObject().put("prompt", p("string", "Detailed description of the picture, in English works best")),
                          listOf("prompt")
                      )
                  )
                  addDocDecls(base)
                  addHomeDecls(base)
                  base.put(
                      decl(
                          "create_routine",
                          "Schedules a task that Crimson runs by itself at a set time, even when the app is closed, and reads the result aloud.",
                          JSONObject()
                              .put("task", p("string", "A complete, self-contained instruction, for example: tell me the weather, my calendar and the top news"))
                              .put("hour", p("integer", "Hour, 0 to 23"))
                              .put("minute", p("integer", "Minute, 0 to 59"))
                              .put(
                                  "days",
                                  JSONObject().put("type", "array").put("items", JSONObject().put("type", "integer"))
                                      .put("description", "Optional weekdays, 1 = Sunday ... 7 = Saturday. Empty means every day. Weekdays are 2,3,4,5,6")
                              )
                              .put("name", p("string", "Short name"))
                              .put("speak", p("boolean", "Read the result aloud, default true")),
                          listOf("task", "hour", "minute")
                      )
                  )
                  base.put(decl("list_routines", "Lists the scheduled routines.", null, emptyList()))
                  base.put(
                      decl(
                          "delete_routine", "Deletes a scheduled routine.",
                          JSONObject().put("name", p("string", "Routine name or part of it")), listOf("name")
                      )
                  )
                  base.put(
                      decl(
                          "toggle_routine", "Turns a scheduled routine on or off.",
                          JSONObject().put("name", p("string", "Routine name or part of it")).put("enabled", p("boolean", "true to turn on")),
                          listOf("name", "enabled")
                      )
                  )
                  base.put(
                      decl(
                          "start_interpreter",
                          "Opens the live interpreter so two people can talk in two languages.",
                          JSONObject()
                              .put("language_a", p("string", "First language, for example Turkish"))
                              .put("language_b", p("string", "Second language, for example German")),
                          emptyList()
                      )
                  )
                  base.put(decl("usage_report", "Tells how many AI requests were made and the estimated money spent.", null, emptyList()))
                  return base
              }

              /** Returns null when [name] is not one of these tools. */
              fun run(ctx: Context, name: String, a: JSONObject, en: Boolean): String? = when (name) {
                  "generate_image" -> ImageGen.generate(ctx, a.optString("prompt"))
                  "search_docs" -> Docs.search(ctx, a.optString("query"), a.optString("file"))
                  "read_doc" -> {
                      val from = a.optInt("from_page", 1)
                      Docs.read(ctx, a.optString("file"), from, a.optInt("to_page", from + 3))
                  }
                  "list_docs" -> Docs.summary(ctx)
                  "smart_home" -> Home.act(ctx, a.optString("device"), a.optString("action"), a.optInt("value", 0))
                  "list_devices" -> Home.list(ctx)
                  "create_routine" -> createRoutine(ctx, a, en)
                  "list_routines" -> {
                      val list = Routines.load(ctx)
                      if (list.isEmpty()) {
                          "no routines"
                      } else {
                          list.joinToString("\n") {
                              "- " + it.name + " (" + Routines.describe(it, en) + (if (it.enabled) "" else ", off") + "): " + it.task.take(80)
                          }
                      }
                  }
                  "delete_routine" -> if (Routines.remove(ctx, a.optString("name"))) "routine deleted" else "error: no routine with that name"
                  "toggle_routine" -> {
                      val on = a.optBoolean("enabled", true)
                      val r = Routines.setEnabled(ctx, a.optString("name"), on)
                      if (r == null) "error: no routine with that name" else r.name + " is now " + (if (on) "on" else "off")
                  }
                  "start_interpreter" -> startInterpreter(ctx, a)
                  "usage_report" -> Usage.spoken(en)
                  else -> null
              }

              private fun createRoutine(ctx: Context, a: JSONObject, en: Boolean): String {
                  val task = a.optString("task").trim()
                  val h = a.optInt("hour", -1)
                  val m = a.optInt("minute", 0)
                  if (task.isEmpty()) return "error: no task given"
                  if (h !in 0..23 || m !in 0..59) return "error: invalid time"
                  val days = ArrayList<Int>()
                  val arr = a.optJSONArray("days")
                  if (arr != null) {
                      for (i in 0 until arr.length()) days.add(arr.optInt(i, 0))
                  }
                  val r = Routines.create(ctx, a.optString("name"), task, h, m, days, a.optBoolean("speak", true))
                  val next = java.text.SimpleDateFormat("EEEE HH:mm", java.util.Locale.forLanguageTag(if (en) "en-US" else "tr-TR"))
                      .format(java.util.Date(Routines.nextTime(r, System.currentTimeMillis())))
                  var msg = "routine saved: " + r.name + ", " + Routines.describe(r, en) + ". Next run: " + next + "."
                  if (!Routines.canExact(ctx)) {
                      val i = Routines.exactSettingsIntent(ctx)
                      if (i != null) {
                          try {
                              ctx.startActivity(i)
                          } catch (e: Exception) {
                          }
                      }
                      msg += " Exact alarms are not allowed yet, so it may run a few minutes late. The permission screen was opened: ask the user to allow it."
                  }
                  return msg
              }

              private fun startInterpreter(ctx: Context, a: JSONObject): String {
                  val act = ctx as? Activity ?: return "error: the interpreter can only be opened inside the app"
                  val la = Interpreter.resolve(a.optString("language_a"))
                  val lb = Interpreter.resolve(a.optString("language_b"))
                  act.runOnUiThread { Interpreter.show(act, la, lb) }
                  return "interpreter opened. Tell the user to tap the button of whoever speaks."
              }

              /** Added to the chat system prompt. */
              fun prompt(ctx: Context, en: Boolean): String {
                  val docs = Docs.names(ctx)
                  val sb = StringBuilder()
                  if (en) {
                      sb.append(
                          "More abilities: generate_image draws a picture and shows it (confirm in one short sentence). " +
                              "search_docs, read_doc and list_docs answer from the user's uploaded documents: cite file name and page, never invent. " +
                              "smart_home and list_devices control lights and plugs. " +
                              "create_routine, list_routines, delete_routine and toggle_routine manage tasks that run by themselves even when the app is closed (days: 1 Sunday to 7 Saturday, empty means every day; write the task as a complete instruction). " +
                              "start_interpreter opens the live two-way translator. usage_report says how many requests were made and the estimated cost."
                      )
                      if (docs.isNotEmpty()) sb.append(" The user's documents: ").append(docs.take(20).joinToString(", ")).append(".")
                  } else {
                      sb.append(
                          "Ek yetenekler: generate_image resim çizer ve gösterir (tek kısa cümleyle onayla). " +
                              "search_docs, read_doc ve list_docs kullanıcının yüklediği belgelerden cevap verir: dosya adı ve sayfayı belirt, uydurma. " +
                              "smart_home ve list_devices ışık ve prizleri yönetir. " +
                              "create_routine, list_routines, delete_routine ve toggle_routine uygulama kapalıyken bile kendi kendine çalışan görevleri yönetir (days: 1 Pazar ... 7 Cumartesi, boş her gün; görevi eksiksiz bir talimat olarak yaz). " +
                              "start_interpreter canlı iki yönlü çeviriyi açar. usage_report kaç istek yapıldığını ve tahmini maliyeti söyler."
                      )
                      if (docs.isNotEmpty()) sb.append(" Kullanıcının belgeleri: ").append(docs.take(20).joinToString(", ")).append(".")
                  }
                  return sb.toString()
              }
          }
