              chatOff = "CHAT OFF",
              settings = "SETUP",
              keyTitle = "Gemini API key",
              keyMsg = "Paste the free key from aistudio.google.com. It is stored only on this phone.",
              save = "Save",
              cancel = "Cancel",
              needKey = "Enter your API key first.",
              badKey = "The API key looks invalid. Check it in SETUP.",
              rate = "That was a bit fast. Wait a few seconds and try again.",
              fail = "No answer came back. Try again.",
              offline = "You seem to be offline.",
