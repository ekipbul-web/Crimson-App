              /** Hey Crimson listens only while the app is closed, idle and the setting is on. */
              private fun personaName(): String {
                  val en = lang == "en"
                  return when (prefs.getInt("persona", 0)) {
                      1 -> if (en) "short" else "kısa"
                      2 -> if (en) "witty" else "esprili"
                      3 -> if (en) "formal" else "resmi"
                      else -> if (en) "normal" else "normal"
                  }
              }

              private fun wakeSync() {
                  val on = prefs.getBoolean("wake_on", false) && !foreground && !busy && state == St.IDLE
                  WakeService.setActive(on)
              }

              private fun startWake() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      note(l.wakeMic)
                      val perms = if (Build.VERSION.SDK_INT >= 33) {
                          arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                      } else {
                          arrayOf(Manifest.permission.RECORD_AUDIO)
                      }
                      requestPermissions(perms, 5)
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 6)
                  }
                  try {
                      startForegroundService(Intent(this, WakeService::class.java))
                  } catch (e: Exception) {
                      note(l.fail + "\n" + e.javaClass.simpleName + ": " + e.message.orEmpty().take(120))
                  }
                  wakeSync()
              }

