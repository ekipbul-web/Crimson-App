                      ellipsize = TextUtils.TruncateAt.MIDDLE
                  }
                  attachRow.addView(attachLabel, LinearLayout.LayoutParams(0, wrapP, 1f))
                  val attachX = TextView(this).apply {
                      text = "×"
                      setTextColor(MUTE)
                      textSize = 22f
                      setPadding(dp(14), dp(2), dp(10), dp(2))
                      setOnClickListener {
                          attach = null
                          updateAttachRow()
                      }
                  }
                  attachRow.addView(attachX, LinearLayout.LayoutParams(wrapP, wrapP))
                  root.addView(attachRow, LinearLayout.LayoutParams(matchP, wrapP).apply { topMargin = dp(8) })
                  root.addView(bottom, LinearLayout.LayoutParams(matchP, wrapP).apply { topMargin = dp(8) })

                  val frame = FrameLayout(this).apply { setBackgroundColor(BG) }
                  frame.addView(HudBackground(this), FrameLayout.LayoutParams(matchP, matchP))
                  frame.addView(root, FrameLayout.LayoutParams(matchP, matchP, Gravity.CENTER_HORIZONTAL))
                  rootView = root
                  setContentView(frame)
                  applyMetrics()

                  langPill.setOnClickListener {
                      lang = if (lang == "tr") "en" else "tr"
                      l = if (lang == "en") EN else TR
                      prefs.edit().putString("lang", lang).apply()
                      stopListening()
                      applyLang()
                  }
                  voicePill.setOnClickListener {
                      voiceOn = !voiceOn
                      if (!voiceOn) stopSpeech()
                      applyLang()
                  }
                  chatPill.setOnClickListener {
                      loop = !loop
                      applyLang()
                  }
                  settingsPill.setOnClickListener { showMenu() }
              }

