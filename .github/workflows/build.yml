              private fun download(dest: File) {
                  val c = URL(MODEL_URL).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  try {
                      val code = c.responseCode
                      if (code !in 200..299) throw IOException("indirme HTTP " + code)
                      val total = c.contentLength.toLong()
                      c.inputStream.use { ins ->
                          FileOutputStream(dest).use { out ->
                              val buf = ByteArray(65536)
                              var done = 0L
                              var lastShow = 0L
                              while (true) {
                                  val n = ins.read(buf)
                                  if (n < 0) break
                                  out.write(buf, 0, n)
                                  done += n
                                  val now = System.currentTimeMillis()
                                  if (now - lastShow > 1500) {
                                      lastShow = now
                                      val shown = if (total > 0) "%" + (done * 100 / total) else (done / 1_000_000).toString() + " MB"
                                      updateNote("Model indiriliyor " + shown)
                                  }
                              }
                          }
                      }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun unzip(zip: File, dest: File) {
                  val base = dest.canonicalPath + File.separator
                  ZipInputStream(zip.inputStream().buffered()).use { zin ->
                      var e = zin.nextEntry
                      while (e != null) {
                          val f = File(dest, e.name)
                          if (!f.canonicalPath.startsWith(base)) throw IOException("geçersiz zip kaydı")
                          if (e.isDirectory) {
                              f.mkdirs()
                          } else {
                              f.parentFile?.mkdirs()
                              FileOutputStream(f).use { zin.copyTo(it) }
                          }
                          zin.closeEntry()
                          e = zin.nextEntry
                      }
                  }
              }

