              private fun applyLang() {
                  JarvisAccess.english = lang == "en"
                  langPill.text = lang.uppercase()
                  voicePill.text = if (voiceOn) l.voiceOn else l.voiceOff
                  chatPill.text = if (loop) l.chatOn else l.chatOff
                  settingsPill.text = l.settings
                  supportBtn.text = "♥  " + tx(lang == "en", "Destek ol", "Support")
                  input.hint = l.hint
                  styled(langPill, true)
                  styled(voicePill, voiceOn)
                  styled(chatPill, loop)
                  styled(settingsPill, false)
                  setState(state)
                  if (startCard != null) showStartCard()
                  if (ttsReady) applyTtsLang()
              }

              private fun setState(s: St) {
                  state = s
                  val listening = s == St.LISTENING
                  statusView.text = when (s) {
                      St.IDLE -> l.idle
                      St.LISTENING -> l.listening
                      St.THINKING -> l.thinking
                      St.SPEAKING -> l.speaking
                  }
                  statusView.setTextColor(if (listening) AMBER else ACCENT_SOFT)
                  orb.color = if (listening) AMBER else ACCENT
                  orb.speaking = s == St.SPEAKING
                  orb.speed = when (s) {
                      St.IDLE -> 1f
                      St.LISTENING -> 1.8f
                      St.THINKING -> 4f
                      St.SPEAKING -> 1.5f
                  }
                  orb.pulseSpeed = when (s) {
                      St.IDLE -> 1f
                      St.LISTENING -> 2f
                      St.THINKING -> 2.5f
                      St.SPEAKING -> 3.5f
                  }
                  micBtn.background = btnBg(if (listening) AMBER else null, if (listening) AMBER else ACCENT_DIM)
                  micBtn.setColorFilter(if (listening) Color.parseColor("#1A1000") else ACCENT)
                  wakeSync()
              }

              private fun note(text: String?) {
                  if (text.isNullOrBlank()) {
                      noteView.visibility = View.GONE
                  } else {
                      noteView.text = text
                      noteView.visibility = View.VISIBLE
                  }
              }

              private fun addBubble(text: String, mine: Boolean): TextView {
                  val side = if (mine) Gravity.END else Gravity.START
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val label = TextView(this).apply {
                      this.text = if (mine) (if (lang == "en") "YOU" else "SEN") else "Crimson"
                      textSize = 10f
                      letterSpacing = 0.2f
                      typeface = Typeface.MONOSPACE
                      setTextColor(if (mine) MUTE else ACCENT_SOFT)
                  }
                  col.addView(label, LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = side
                      bottomMargin = dp(3)
                  })

                  val r = dp(20).toFloat()
                  val s = dp(4).toFloat()
                  val tv = TextView(this).apply {
                      this.text = text
                      textSize = 16f
                      setTextColor(if (mine) Color.WHITE else FG)
                      setPadding(dp(15), dp(11), dp(15), dp(11))
                      background = GradientDrawable().apply {
                          cornerRadii = if (mine) {
                              floatArrayOf(r, r, r, r, s, s, r, r)
                          } else {
                              floatArrayOf(r, r, r, r, r, r, s, s)
                          }
                          setColor(if (mine) ACCENT_DIM else PANEL)
                          if (!mine) setStroke(dp(1), LINE)
                      }
                      maxWidth = (min(resources.displayMetrics.widthPixels, dp(640)) * 0.84f).toInt()
                      setTextIsSelectable(true)
                  }
                  col.addView(tv, LinearLayout.LayoutParams(wrapP, wrapP).apply { gravity = side })

                  log.addView(col, LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = side
                      bottomMargin = dp(12)
                  })
                  col.alpha = 0f
                  col.translationY = dp(8).toFloat()
                  col.animate().alpha(1f).translationY(0f).setDuration(220).start()
                  scrollDown()
                  return tv
              }

              /** A small system line such as "› SET_ALARM", placed above the pending answer. */
              private fun addToolLine(name: String, error: String? = null) {
                  val tv = TextView(this).apply {
                      text = "› " + name.uppercase(Locale.ROOT) + (if (error != null) "  ✗ " + error else "")
                      textSize = 11f
                      letterSpacing = 0.12f
                      typeface = Typeface.MONOSPACE
                      setTextColor(if (error != null) DANGER else MUTE)
                  }
                  log.addView(tv, maxOf(0, log.childCount - 1), LinearLayout.LayoutParams(wrapP, wrapP).apply {
                      gravity = Gravity.START
                      bottomMargin = dp(8)
                  })
                  scrollDown()
              }

              /** A picture made by generate_image, placed above the pending answer. Tap to open it. */
              private fun addImageBubble(path: String, uriStr: String?) {
                  val opts = BitmapFactory.Options()
                  opts.inSampleSize = 2
                  val bmp = BitmapFactory.decodeFile(path, opts) ?: return
                  val iv = ImageView(this)
                  iv.setImageBitmap(bmp)
                  iv.adjustViewBounds = true
                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                  iv.background = GradientDrawable().apply {
                      cornerRadius = dp(12).toFloat()
                      setStroke(dp(1), LINE)
                  }
                  if (uriStr != null) {
                      iv.setOnClickListener {
                          try {
                              startActivity(
                                  Intent(Intent.ACTION_VIEW).setDataAndType(Uri.parse(uriStr), "image/*")
                                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              )
                          } catch (e: Exception) {
                          }
                      }
                  }
                  val w = minOf(dp(300), (resources.displayMetrics.widthPixels * 0.84f).toInt())
                  log.addView(iv, maxOf(0, log.childCount - 1), LinearLayout.LayoutParams(w, wrapP).apply {
                      gravity = Gravity.START
                      bottomMargin = dp(10)
                  })
                  scrollDown()
              }

              private fun startDots(tv: TextView) {
                  stopDots()
                  val frames = arrayOf("●··", "●●·", "●●●")
                  var i = 0
                  tv.typeface = Typeface.MONOSPACE
                  val r = object : Runnable {
                      override fun run() {
                          tv.text = frames[i % 3]
                          i++
                          ui.postDelayed(this, 350)
                      }
                  }
                  dots = r
                  r.run()
              }

              private fun stopDots() {
                  dots?.let { ui.removeCallbacks(it) }
                  dots = null
              }

              private fun finishBubble(tv: TextView, text: String) {
                  stopDots()
                  tv.typeface = Typeface.DEFAULT
                  tv.text = text
              }

              private fun scrollDown() {
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }


              private fun showKeyDialog() {
                  val en = lang == "en"
                  val provs = Prov.values()
                  val primary = Prov.primary(prefs)
                  val rows = provs.map { p ->
                      val has = Prov.key(prefs, p).isNotEmpty()
                      (if (has) "●  " else "○  ") + p.label +
                          (if (has && p == primary) (if (en) "  (primary)" else "  (ana)") else "") +
                          (if (has && p != Prov.GEMINI) "\n     " + Prov.model(prefs, p) else "")
                  }.toTypedArray()
                  AlertDialog.Builder(this, R.style.JarvisDialog)
                      .setTitle(l.keyTitle)
                      .setItems(arrayOf(tx(en, "ⓘ  Anahtar nasıl alınır?", "ⓘ  How to get a key")) + rows) { _, i ->
                          if (i == 0) showKeyGuide() else editProvider(provs[i - 1])
                      }
                      .setNeutralButton(if (en) "Test all" else "Hepsini test et") { _, _ -> testAll() }
                      .setNegativeButton(l.cancel, null)
                      .show()
              }

              private fun editProvider(p: Prov) {
                  val en = lang == "en"
                  val keyEt = EditText(this).apply {
                      hint = p.keyHint
                      setTextColor(FG)
                      setHintTextColor(MUTE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setSingleLine(true)
                      setText(Prov.key(prefs, p))
                  }
                  val modelEt = EditText(this).apply {
                      hint = (if (en) "Model, empty = " else "Model, boş = ") + p.defaultModel
                      setTextColor(FG)
                      setHintTextColor(MUTE)
                      inputType = InputType.TYPE_CLASS_TEXT
                      setSingleLine(true)
                      setText(prefs.getString("model_" + p.id, "") ?: "")
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), 0)
                      addView(keyEt)
                      if (p != Prov.GEMINI) addView(modelEt)
                  }
                  AlertDialog.Builder(this, R.style.JarvisDialog)
                      .setTitle(p.label)
                      .setMessage(p.help(en))
                      .setView(box)
                      .setPositiveButton(l.save) { _, _ ->
                          val ed = Secrets.put(prefs.edit(), Prov.keyName(p), keyEt.text.toString().trim())
                          if (p != Prov.GEMINI) ed.putString("model_" + p.id, modelEt.text.toString().trim())
                          ed.apply()
                          apiKey = Prov.key(prefs, Prov.GEMINI)
                          Health.reset()
                          note(null)
                          testAll()
                      }
                      .setNeutralButton(if (en) "Back" else "Geri") { _, _ -> showKeyDialog() }
                      .setNegativeButton(l.cancel, null)
                      .show()
              }

              /** Sends a tiny request to every provider that has a key and shows the result. */
              private fun testAll() {
                  val en = lang == "en"
                  val list = Prov.configured(prefs)
                  if (list.isEmpty()) return
                  note(if (en) "Testing…" else "Test ediliyor…")
                  worker.execute {
                      val lines = ArrayList<String>()
                      for (p in list) {
                          val k = Prov.key(prefs, p)
                          val t0 = System.currentTimeMillis()
                          val line = try {
                              if (p == Prov.GEMINI) {
                                  val body = JSONObject().put(
                                      "contents",
                                      JSONArray().put(
                                          JSONObject().put("role", "user")
                                              .put("parts", JSONArray().put(JSONObject().put("text", "ping")))
                                      )
                                  )
                                  post(MODELS[0], k, body, 15000)
                              } else {
                                  Llm.run(
                                      p, k, Prov.model(prefs, p), "Reply with OK.", listOf("user" to "ping"),
                                      null, JSONArray(), { false }, { _, _ -> "" }, "", { }
                                  )
                              }
                              "✓ " + p.label + " · " + (System.currentTimeMillis() - t0) + " ms"
                          } catch (e: ApiError) {
                              "✗ " + p.label + " · HTTP " + e.code +
                                  (if (e.code == 401 || e.code == 403) (if (en) " (bad key)" else " (anahtar geçersiz)") else "")
                          } catch (e: Exception) {
                              "✗ " + p.label + " · " + e.javaClass.simpleName
                          }
                          lines.add(line)
                      }
                      runOnUiThread { note(lines.joinToString("\n")) }
                  }
              }

              private fun cyclePrimary() {
                  val list = Prov.configured(prefs)
                  if (list.isEmpty()) {
                      showKeyDialog()
                      return
                  }
                  val next = list[(list.indexOf(Prov.primary(prefs)) + 1) % list.size]
                  prefs.edit().putString("primary", next.id).apply()
                  Health.reset()
                  note((if (lang == "en") "Primary AI: " else "Ana yapay zekâ: ") + next.label)
              }

              private fun providerNote() {
                  val p = usedProv ?: return
                  if (p != Prov.primary(prefs)) {
                      note((if (lang == "en") "Backup provider answered: " else "Yedek sağlayıcı cevapladı: ") + p.label)
                  }
              }

              private fun shareChat() {
                  if (history.isEmpty()) {
                      note(if (lang == "en") "Nothing to share yet." else "Henüz paylaşılacak bir sohbet yok.")
                      return
                  }
                  val sb = StringBuilder()
                  for ((r, m) in history) {
                      sb.append(if (r == "user") (if (lang == "en") "You: " else "Sen: ") else "Crimson: ").append(m).append("\n\n")
                  }
                  val i = Intent(Intent.ACTION_SEND).apply {
                      type = "text/plain"
                      putExtra(Intent.EXTRA_TEXT, sb.toString().trim())
                  }
                  try {
                      startActivity(Intent.createChooser(i, "Crimson"))
                  } catch (e: Exception) {
                      note(l.fail)
                  }
              }

