              // ---------- acting ----------

              fun act(ctx: Context, device: String, actionRaw: String, value: Int): String {
                  val action = actionRaw.lowercase(Locale.ROOT).trim()
                  if (action != "on" && action != "off" && action != "toggle" && action != "status" && action != "set") {
                      return "error: action must be on, off, toggle, status or set"
                  }
                  val k = nk(device)
                  if (k.isEmpty()) return "error: no device given"

                  val saved = hooks(ctx)
                  val h = saved.firstOrNull { nk(it.name) == k }
                      ?: saved.firstOrNull { nk(it.name).contains(k) || k.contains(nk(it.name)) }
                  if (h != null) return webhook(h, action)

                  if (!haConfigured(ctx)) {
                      return "error: there is no smart home device named " + device +
                          " and Home Assistant is not set up. Tell the user to add devices under More, Smart home."
                  }
                  return try {
                      actHa(ctx, device, k, action, value)
                  } catch (e: ApiError) {
                      when (e.code) {
                          401 -> "error: Home Assistant rejected the token"
                          404 -> "error: Home Assistant does not know that service"
                          else -> "error: Home Assistant answered HTTP " + e.code
                      }
                  } catch (e: IOException) {
                      "error: cannot reach Home Assistant. The phone may not be on the home network (" + e.javaClass.simpleName + ")"
                  }
              }

              private fun find(ctx: Context, device: String, k: String, force: Boolean): List<Dev> {
                  val devs = states(ctx, force)
                  val exact = devs.filter { nk(it.name) == k || it.entity.lowercase(Locale.ROOT) == device.trim().lowercase(Locale.ROOT) }
                  if (exact.isNotEmpty()) return exact
                  return devs.filter { nk(it.name).contains(k) }
              }

              private fun actHa(ctx: Context, device: String, k: String, action: String, value: Int): String {
                  var match = find(ctx, device, k, false)
                  if (match.isEmpty()) match = find(ctx, device, k, true)
                  if (match.isEmpty()) {
                      val known = states(ctx, false).take(15).joinToString(", ") { it.name }
                      return "error: no device named " + device + ". Known devices: " + known
                  }
                  if (match.size > 1) {
                      return "error: several devices match: " + match.take(5).joinToString(", ") { it.name } + ". Ask the user which one."
                  }
                  val d = match[0]
                  val base = haUrl(ctx)

                  if (action == "status") {
                      val o = JSONObject(Net.get(base + "/api/states/" + d.entity, auth(ctx), 12000))
                      val attrs = o.optJSONObject("attributes")
                      val br = attrs?.optInt("brightness", -1) ?: -1
                      return d.name + " is " + o.optString("state") + (if (br >= 0) ", brightness " + (br * 100 / 255) + " percent" else "")
                  }

                  val data = JSONObject().put("entity_id", d.entity)
                  val service: String
                  if (d.domain == "scene" || d.domain == "script") {
                      if (action != "on") return "error: " + d.name + " is a " + d.domain + " and can only be started (on)"
                      service = "turn_on"
                  } else if (d.domain == "cover") {
                      service = when (action) {
                          "on" -> "open_cover"
                          "off" -> "close_cover"
                          "toggle" -> "toggle"
                          else -> return "error: covers support on, off and toggle"
                      }
                  } else if (action == "set") {
                      if (value !in 1..100) return "error: value must be 1 to 100"
                      if (d.domain == "light") {
                          service = "turn_on"
                          data.put("brightness_pct", value)
                      } else if (d.domain == "fan") {
                          service = "set_percentage"
                          data.put("percentage", value)
                      } else {
                          return "error: set works only for lights (brightness) and fans (speed)"
                      }
                  } else {
                      service = when (action) {
                          "on" -> "turn_on"
                          "off" -> "turn_off"
                          else -> "toggle"
                      }
                      if (action == "on" && d.domain == "light" && value in 1..100) data.put("brightness_pct", value)
                  }
                  Net.request("POST", base + "/api/services/" + d.domain + "/" + service, auth(ctx), data.toString(), 15000)
                  cachedAt = 0L
                  return "ok: " + d.name + " " + action + (if (action == "set") " " + value + " percent" else "")
              }

              // ---------- webhooks ----------

              private fun webhook(h: Hook, action: String): String {
                  if (action == "status" || action == "set") return "error: " + h.name + " only supports on, off and toggle"
                  val raw = when (action) {
                      "on" -> h.on
                      "off" -> h.off
                      else -> h.toggle
                  }
                  if (raw.isBlank()) return "error: no address is saved for " + action + " on " + h.name
                  var method = "GET"
                  var url = raw.trim()
                  if (url.uppercase(Locale.ROOT).startsWith("POST ")) {
                      method = "POST"
                      url = url.substring(5).trim()
                  }
                  if (!url.startsWith("http://") && !url.startsWith("https://")) return "error: the saved address is not valid"
                  return try {
                      Net.request(method, url, emptyMap(), if (method == "POST") "{}" else null, 10000)
                      "ok: " + h.name + " " + action
                  } catch (e: ApiError) {
                      "error: the device answered HTTP " + e.code
                  } catch (e: IOException) {
                      "error: cannot reach " + h.name + " (" + e.javaClass.simpleName + ")"
                  }
              }
          }
