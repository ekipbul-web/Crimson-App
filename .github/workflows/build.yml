                          val def = CloudVoice.ELEVEN_VOICES[0].second
                          CloudVoice.eleven(
                              Secrets.get(prefs, "key_eleven"),
                              prefs.getString("voice_eleven", def) ?: def,
                              text
                          )
                      }
                      if (pcm.size > 2) {
                          Usage.tts(engine, text.length)
                          return pcm
                      }
                      cloudBlockedUntil = System.currentTimeMillis() + 30000L
                  } catch (e: ApiError) {
                      cloudBlockedUntil = System.currentTimeMillis() + when (e.code) {
                          429 -> 60000L
                          401, 402, 403, 404 -> 600000L
                          else -> 30000L
                      }
                  } catch (e: IOException) {
                      cloudBlockedUntil = System.currentTimeMillis() + 30000L
                  }
                  return null
              }

