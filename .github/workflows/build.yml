              private fun applyMetrics() {
                  val w = resources.displayMetrics.widthPixels
                  val lp = rootView.layoutParams as FrameLayout.LayoutParams
                  lp.width = if (w > dp(640)) dp(640) else matchP
                  lp.gravity = Gravity.CENTER_HORIZONTAL
                  rootView.layoutParams = lp
                  val land = resources.configuration.orientation == android.content.res.Configuration.ORIENTATION_LANDSCAPE
                  val size = if (land) dp(88) else dp(156)
                  val olp = orb.layoutParams as LinearLayout.LayoutParams
                  olp.width = size
                  olp.height = size
                  orb.layoutParams = olp
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applyMetrics()
              }

              private fun hintFor(message: String): String {
                  val en = lang == "en"
                  return when {
                      message.startsWith(l.badKey) -> tx(
                          en,
                          "\n\nÇözüm: Ayarlar › Anahtarlar bölümünden anahtarı yeniden gir. Başında ya da sonunda boşluk kalmadığından emin ol.",
                          "\n\nFix: re-enter the key under Settings › Keys. Make sure there are no spaces before or after it."
                      )
                      message.startsWith(l.rate) || message.startsWith(l.busy) -> tx(
                          en,
                          "\n\nİpucu: Ayarlar › Anahtarlar'dan ikinci bir sağlayıcı eklersen Crimson otomatik olarak ona geçer.",
                          "\n\nTip: add a second provider under Settings › Keys and Crimson will switch to it automatically."
                      )
                      message.startsWith(l.offline) -> tx(
                          en,
                          "\n\nÇözüm: Wi-Fi ya da mobil veriyi kontrol et.",
                          "\n\nFix: check your Wi-Fi or mobile data."
                      )
                      else -> ""
                  }
              }

