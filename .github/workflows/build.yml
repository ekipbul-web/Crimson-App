              private val clockTick = object : Runnable {
                  override fun run() {
                      clockView.text = android.text.format.DateFormat.format("HH:mm", Date())
                      ui.postDelayed(this, 5000)
                  }
              }

              // ---------- lifecycle ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  lang = prefs.getString("lang", "tr") ?: "tr"
                  apiKey = prefs.getString("api_key", "") ?: ""
                  l = if (lang == "en") EN else TR
                  window.statusBarColor = BG
                  window.navigationBarColor = BG

                  buildUi()
                  clockTick.run()

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {
                                  runOnUiThread { if (isCurrent(utteranceId)) setState(St.SPEAKING) }
                              }

                              override fun onDone(utteranceId: String?) {
                                  ttsDone(utteranceId)
                              }

                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  ttsDone(utteranceId)
                              }
                          })
                          applyTtsLang()
                      }
                  }

                  applyLang()
                  addBubble(l.hello, false)
                  if (prefs.getString("api_key", "").isNullOrBlank()) {
                      note(l.needKey)
                      showKeyDialog()
                  }
                  handleLaunch(intent)
              }

              override fun onStop() {
                  super.onStop()
                  loop = false
                  stopListening()
                  stopSpeech()
                  applyLang()
              }

              override fun onDestroy() {
                  ui.removeCallbacks(clockTick)
                  stopDots()
                  recognizer?.destroy()
                  recognizer = null
                  tts?.shutdown()
                  worker.shutdown()
                  synthExec.shutdownNow()
                  playExec.shutdownNow()
                  try {
                      track?.release()
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleLaunch(intent)
              }

              /** Started from the quick settings tile, or from another app's share sheet. */
              private fun handleLaunch(i: Intent?) {
                  if (i == null) return
                  if (i.getBooleanExtra("listen", false)) {
                      i.removeExtra("listen")
                      ui.postDelayed({ listen() }, 600)
                  }
                  if (i.action == Intent.ACTION_SEND) {
                      @Suppress("DEPRECATION")
                      val u = i.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                      val txt = i.getStringExtra(Intent.EXTRA_TEXT)
                      i.action = Intent.ACTION_MAIN
                      if (u != null) {
                          loadAsync(u, false)
                      } else if (!txt.isNullOrBlank()) {
                          input.setText(txt)
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7) {
                      photoOk = resultCode == RESULT_OK
                      photoLatch?.countDown()
                  } else if (requestCode == 8) {
                      val u = attachPhotoUri
                      attachPhotoUri = null
                      if (u != null) {
                          if (resultCode == RESULT_OK) loadAsync(u, true) else deleteQuietly(u)
                      }
                  } else if (requestCode == 9 && resultCode == RESULT_OK) {
                      val u = data?.data
                      if (u != null) loadAsync(u, false)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val ok = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                  when (requestCode) {
                      1 -> if (ok) listen() else note(l.micDenied)
                      2, 3 -> note(if (ok) l.permRetry else l.permNo)
                  }
              }

