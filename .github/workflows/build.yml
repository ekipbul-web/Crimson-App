          package app.jarvis

          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Build
          import android.provider.MediaStore
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /** Draws pictures with a Gemini or OpenAI image model, shows them in the chat and saves them to the gallery. */
          object ImageGen {
              const val DEFAULT_OPENAI = "gpt-image-1"
              const val DEFAULT_GEMINI = "gemini-2.5-flash-image"

              fun generate(ctx: Context, prompt: String): String {
                  val prefs = ctx.getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  if (prompt.isBlank()) return "error: empty prompt"
                  val oKey = Prov.key(prefs, Prov.OPENAI)
                  val gKey = Prov.key(prefs, Prov.GEMINI)
                  if (oKey.isEmpty() && gKey.isEmpty()) {
                      return "error: drawing needs a Gemini or OpenAI key. Tell the user to add one in the settings."
                  }
                  val pref = prefs.getString("img_engine", "") ?: ""
                  val first = when {
                      pref == "openai" && oKey.isNotEmpty() -> "openai"
                      pref == "gemini" && gKey.isNotEmpty() -> "gemini"
                      gKey.isNotEmpty() -> "gemini"
                      else -> "openai"
                  }
                  val order = ArrayList<String>()
                  order.add(first)
                  if (first == "gemini" && oKey.isNotEmpty()) order.add("openai")
                  if (first == "openai" && gKey.isNotEmpty()) order.add("gemini")

                  var lastErr = "unknown"
                  for (engine in order) {
                      try {
                          val bytes = if (engine == "openai") openAi(prefs, oKey, prompt) else gemini(prefs, gKey, prompt)
                          Usage.image(engine)
                          return finish(ctx, bytes)
                      } catch (e: ApiError) {
                          lastErr = engine + " HTTP " + e.code + ": " + clean(e.message.orEmpty())
                      } catch (e: IOException) {
                          lastErr = engine + " " + e.javaClass.simpleName + " " + e.message.orEmpty().take(80)
                      }
                  }
                  return "error: no image was made (" + lastErr + "). Tell the user honestly."
              }

              private fun clean(s: String): String {
                  val m = try {
                      JSONObject(s.substringAfter(": ", s)).optJSONObject("error")?.optString("message").orEmpty()
                  } catch (e: Exception) {
                      ""
                  }
                  return (if (m.isNotEmpty()) m else s).replace('\n', ' ').take(160)
              }

              private fun openAi(prefs: SharedPreferences, key: String, prompt: String): ByteArray {
                  val model = (prefs.getString("model_img_openai", "") ?: "").trim().ifEmpty { DEFAULT_OPENAI }
                  val body = JSONObject().put("model", model).put("prompt", prompt).put("n", 1).put("size", "1024x1024")
                  if (model.startsWith("dall-e")) body.put("response_format", "b64_json")
                  val text = Net.request(
                      "POST", "https://api.openai.com/v1/images/generations",
                      mapOf("Authorization" to ("Bearer " + key)), body.toString(), 150000
                  )
                  val d = JSONObject(text).optJSONArray("data")?.optJSONObject(0)
                  val b64 = d?.optString("b64_json").orEmpty()
                  if (b64.isNotEmpty()) return Base64.decode(b64, Base64.DEFAULT)
                  val url = d?.optString("url").orEmpty()
                  if (url.startsWith("https://")) return download(url)
                  throw IOException("no image in the answer")
              }

              private fun gemini(prefs: SharedPreferences, key: String, prompt: String): ByteArray {
                  val model = (prefs.getString("model_img_gemini", "") ?: "").trim().ifEmpty { DEFAULT_GEMINI }
                  val body = JSONObject()
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject().put("role", "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          )
                      )
                      .put("generationConfig", JSONObject().put("responseModalities", JSONArray().put("IMAGE").put("TEXT")))
                  val text = Net.request(
                      "POST", "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                      mapOf("x-goog-api-key" to key), body.toString(), 150000
                  )
                  val parts = JSONObject(text).optJSONArray("candidates")?.optJSONObject(0)
                      ?.optJSONObject("content")?.optJSONArray("parts")
                  var said = ""
                  if (parts != null) {
                      for (i in 0 until parts.length()) {
                          val p = parts.getJSONObject(i)
                          val blob = p.optJSONObject("inlineData") ?: p.optJSONObject("inline_data")
                          val b64 = blob?.optString("data").orEmpty()
                          if (b64.isNotEmpty()) return Base64.decode(b64, Base64.DEFAULT)
                          if (p.has("text")) said = p.optString("text")
                      }
                  }
                  throw IOException("the model returned no image" + (if (said.isNotEmpty()) ": " + said.take(120) else ""))
              }

              private fun download(url: String): ByteArray {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.connectTimeout = 8000
                      conn.readTimeout = 30000
                      if (conn.responseCode !in 200..299) throw IOException("HTTP " + conn.responseCode)
                      val bytes = conn.inputStream.use { it.readBytes() }
                      if (bytes.size > 15_000_000) throw IOException("image too large")
                      return bytes
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun finish(ctx: Context, bytes: ByteArray): String {
                  val isPng = bytes.size > 4 && bytes[0] == 0x89.toByte() && bytes[1] == 'P'.code.toByte()
                  val ext = if (isPng) "png" else "jpg"
                  val mime = if (isPng) "image/png" else "image/jpeg"
                  val name = "jarvis_" + System.currentTimeMillis() + "." + ext

                  val dir = File(ctx.filesDir, "gen")
                  if (!dir.exists()) dir.mkdirs()
                  val file = File(dir, name)
                  file.writeBytes(bytes)
                  val old = dir.listFiles()?.sortedBy { it.lastModified() } ?: emptyList()
                  if (old.size > 20) {
                      for (f in old.take(old.size - 20)) f.delete()
                  }

                  var uriStr: String? = null
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          val v = ContentValues()
                          v.put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          v.put(MediaStore.Images.Media.MIME_TYPE, mime)
                          v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Crimson")
                          val uri = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                          if (uri != null) {
                              ctx.contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                              uriStr = uri.toString()
                          }
                      } catch (e: Exception) {
                          uriStr = null
                      }
                  }
                  val sink = Plus.imageSink
                  if (sink != null) sink(file.absolutePath, uriStr)
                  return "image made" + (if (sink != null) " and shown in the chat" else "") +
                      (if (uriStr != null) ", saved in the gallery folder Pictures/Crimson" else "") +
                      ". Confirm in one short sentence and do not describe the picture."
              }
          }
