              private fun showSearch() {
                  val en = lang == "en"
                  val et = EditText(this).apply {
                      hint = tx(en, "Sohbette ara…", "Search chat…")
                      setTextColor(FG)
                      setHintTextColor(MUTE)
                      inputType = InputType.TYPE_CLASS_TEXT
                      setSingleLine(true)
                  }
                  val res = TextView(this).apply {
                      setTextColor(FG)
                      textSize = 14f
                      setLineSpacing(0f, 1.15f)
                      setPadding(0, dp(12), 0, 0)
                      text = tx(en, "En az 2 harf yaz.", "Type at least 2 letters.")
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), dp(8))
                      addView(et)
                      addView(ScrollView(this@MainActivity).apply { addView(res) }, LinearLayout.LayoutParams(matchP, dp(320)))
                  }
                  fun doSearch(q: String) {
                      val s = q.trim()
                      if (s.length < 2) {
                          res.text = tx(en, "En az 2 harf yaz.", "Type at least 2 letters.")
                          return
                      }
                      val hits = transcript.filter { it.second.contains(s, ignoreCase = true) }.takeLast(30).reversed()
                      if (hits.isEmpty()) {
                          res.text = tx(en, "Sonuç yok.", "No results.")
                          return
                      }
                      val sb = StringBuilder()
                      sb.append(hits.size).append(tx(en, " sonuç\n\n", " results\n\n"))
                      for ((r, m) in hits) {
                          val who = if (r == "user") tx(en, "Sen", "You") else "Crimson"
                          val at = m.indexOf(s, ignoreCase = true)
                          val from = if (at > 60) at - 60 else 0
                          val snippet = m.substring(from, minOf(m.length, from + 180)).replace("\n", " ")
                          sb.append(who).append(": ").append(if (from > 0) "…" else "").append(snippet).append("\n\n")
                      }
                      res.text = sb.toString().trim()
                  }
                  et.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          doSearch(s?.toString().orEmpty())
                      }
                      override fun afterTextChanged(s: android.text.Editable?) {}
                  })
                  AlertDialog.Builder(this, R.style.JarvisDialog)
                      .setTitle(tx(en, "Sohbette ara", "Search chat"))
                      .setView(box)
                      .setNegativeButton(tx(en, "Kapat", "Close"), null)
                      .show()
              }

              // ---------- app lock ----------

              private fun toggleLock() {
                  val en = lang == "en"
                  if (prefs.getBoolean("app_lock", false)) {
                      prefs.edit().putBoolean("app_lock", false).apply()
                      note(tx(en, "Uygulama kilidi kapatıldı.", "App lock turned off."))
                      return
                  }
                  val km = getSystemService(Context.KEYGUARD_SERVICE) as android.app.KeyguardManager
                  if (!km.isDeviceSecure) {
                      note(tx(en, "Önce telefona bir ekran kilidi (PIN, desen ya da parmak izi) ayarla.", "Set up a screen lock (PIN, pattern or fingerprint) on your phone first."))
                      return
                  }
                  prefs.edit().putBoolean("app_lock", true).apply()
                  note(tx(en, "Uygulama kilidi açıldı. Uygulamaya döndüğünde kilit sorulur.", "App lock is on. You'll be asked when you return to the app."))
              }

              private fun requireUnlock() {
                  val en = lang == "en"
                  val km = getSystemService(Context.KEYGUARD_SERVICE) as android.app.KeyguardManager
                  if (!km.isDeviceSecure) {
                      prefs.edit().putBoolean("app_lock", false).apply()
                      return
                  }
                  val i = km.createConfirmDeviceCredentialIntent(
                      "Crimson",
                      tx(en, "Devam etmek için kimliğini doğrula", "Verify it's you to continue")
                  ) ?: return
                  locked = true
                  lastStop = 0L
                  rootView.visibility = View.INVISIBLE
                  try {
                      startActivityForResult(i, 23)
                  } catch (e: Exception) {
                      locked = false
                      rootView.visibility = View.VISIBLE
                  }
              }

              // ---------- backup, delete, updates, reporting ----------

              private fun exportBackup() {
                  val i = Intent(Intent.ACTION_CREATE_DOCUMENT)
                      .addCategory(Intent.CATEGORY_OPENABLE)
                      .setType("application/json")
                      .putExtra(Intent.EXTRA_TITLE, "crimson-backup.json")
                  try {
                      startActivityForResult(i, 21)
                  } catch (e: Exception) {
                      note(l.fail)
                  }
              }

              private fun importBackup() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      .addCategory(Intent.CATEGORY_OPENABLE)
                      .setType("*/*")
                  try {
                      startActivityForResult(i, 22)
                  } catch (e: Exception) {
                      note(l.fail)
                  }
              }

              private fun writeBackup(u: Uri?, resultCode: Int) {
                  if (u == null || resultCode != RESULT_OK) return
                  val en = lang == "en"
                  try {
                      contentResolver.openOutputStream(u)?.use { it.write(Backup.export(prefs).toByteArray(Charsets.UTF_8)) }
                      note(tx(en, "Yedek kaydedildi. Dosya sohbetlerini içerir, güvenli bir yerde sakla.", "Backup saved. It contains your chats, keep it somewhere safe."))
                  } catch (e: Exception) {
                      note(l.fail)
                  }
              }

              private fun readBackup(u: Uri?, resultCode: Int) {
                  if (u == null || resultCode != RESULT_OK) return
                  val en = lang == "en"
                  try {
                      val text = contentResolver.openInputStream(u)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      val n = Backup.restore(prefs, text)
                      if (n < 0) {
                          note(tx(en, "Bu dosya geçerli bir Crimson yedeği değil.", "That is not a valid Crimson backup."))
                      } else {
                          Pal.load(prefs)
                          android.widget.Toast.makeText(
                              this,
                              tx(en, "Yedek geri yüklendi. API anahtarlarını yeniden girmen gerekir.", "Backup restored. Please enter your API keys again."),
                              android.widget.Toast.LENGTH_LONG
                          ).show()
                          recreate()
                      }
                  } catch (e: Exception) {
                      note(l.fail)
                  }
              }

              private fun confirmWipe() {
                  val en = lang == "en"
                  AlertDialog.Builder(this, R.style.JarvisDialog)
                      .setTitle(tx(en, "Tüm verilerim silinsin mi?", "Delete all my data?"))
                      .setMessage(
