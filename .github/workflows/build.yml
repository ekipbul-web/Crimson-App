              private val clockTick = object : Runnable {
                  override fun run() {
                      clockView.text = android.text.format.DateFormat.format("HH:mm", Date())
                      ui.postDelayed(this, 5000)
                  }
              }

              // ---------- lifecycle ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Pal.load(prefs)
                  Secrets.migrate(prefs)
                  lang = prefs.getString("lang", "tr") ?: "tr"
                  apiKey = Secrets.get(prefs, "api_key")
                  l = if (lang == "en") EN else TR
                  window.statusBarColor = BG
                  window.navigationBarColor = BG

                  buildUi()
                  clockTick.run()

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {
                                  runOnUiThread { if (isCurrent(utteranceId)) setState(St.SPEAKING) }
                              }

                              override fun onDone(utteranceId: String?) {
                                  ttsDone(utteranceId)
                              }

                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  ttsDone(utteranceId)
                              }
                          })
                          applyTtsLang()
                      }
                  }

                  applyLang()
                  restoreChat()
                  if (!prefs.getBoolean("onboarded", false)) {
                      showWelcome()
                  } else if (Prov.configured(prefs).isEmpty()) {
                      note(l.needKey)
                      showKeyDialog()
                  }
                  JarvisAccess.english = lang == "en"
                  Usage.init(this)
                  Routines.rearmAll(this)
                  Plus.imageSink = { path, uri -> runOnUiThread { addImageBubble(path, uri) } }
                  if (prefs.getBoolean("wake_on", false)) startWake()
                  if (prefs.getBoolean("app_lock", false)) requireUnlock()
                  handleLaunch(intent)
              }

              override fun onStart() {
                  super.onStart()
                  foreground = true
                  if (prefs.getBoolean("app_lock", false) && !locked && lastStop != 0L &&
                      android.os.SystemClock.elapsedRealtime() - lastStop > 60000L
                  ) {
                      requireUnlock()
                  }
                  WakeService.cancelAlert(this)
                  wakeSync()
              }

              override fun onStop() {
                  super.onStop()
                  foreground = false
                  lastStop = android.os.SystemClock.elapsedRealtime()
                  loop = false
                  stopListening()
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(false)
                      setTurnScreenOn(false)
                  }
                  applyLang()
                  wakeSync()
              }

              /** While the phone control service is on and Crimson is in the background, open things from the service. */
              override fun startActivity(intent: Intent?) {
                  val svc = JarvisAccess.instance
                  if (!foreground && svc != null && intent != null) {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      svc.startActivity(intent)
                  } else {
                      super.startActivity(intent)
                  }
              }

              override fun onDestroy() {
                  Plus.imageSink = null
                  Interpreter.closeAll()
                  ui.removeCallbacks(clockTick)
                  stopDots()
                  recognizer?.destroy()
                  recognizer = null
                  tts?.shutdown()
                  worker.shutdown()
                  synthExec.shutdownNow()
                  playExec.shutdownNow()
                  try {
                      track?.release()
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleLaunch(intent)
              }

              /** Started from the quick settings tile, or from another app's share sheet. */
              private fun handleLaunch(i: Intent?) {
                  if (i == null || locked) return
                  if (i.getBooleanExtra("wake", false)) {
                      i.removeExtra("wake")
                      if (Build.VERSION.SDK_INT >= 27) {
                          setShowWhenLocked(true)
                          setTurnScreenOn(true)
                      }
                  }
                  if (i.getBooleanExtra("listen", false)) {
                      i.removeExtra("listen")
                      ui.postDelayed({ listen() }, 600)
                  }
                  if (i.action == Intent.ACTION_SEND) {
                      @Suppress("DEPRECATION")
                      val u = i.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                      val txt = i.getStringExtra(Intent.EXTRA_TEXT)
                      i.action = Intent.ACTION_MAIN
                      if (u != null) {
                          loadAsync(u, false)
                      } else if (!txt.isNullOrBlank()) {
                          input.setText(txt)
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 23) {
                      if (resultCode == RESULT_OK) {
                          locked = false
                          lastStop = 0L
                          rootView.visibility = View.VISIBLE
                          handleLaunch(intent)
                      } else {
                          finish()
                      }
                  } else if (requestCode == 21) {
                      writeBackup(data?.data, resultCode)
                  } else if (requestCode == 22) {
                      readBackup(data?.data, resultCode)
                  } else if (requestCode == 7) {
                      photoOk = resultCode == RESULT_OK
                      photoLatch?.countDown()
                  } else if (requestCode == 8) {
                      val u = attachPhotoUri
                      attachPhotoUri = null
                      if (u != null) {
                          if (resultCode == RESULT_OK) loadAsync(u, true) else deleteQuietly(u)
                      }
                  } else if (requestCode == 9 && resultCode == RESULT_OK) {
                      val u = data?.data
                      if (u != null) loadAsync(u, false)
                  } else if (requestCode == 10 && resultCode == RESULT_OK && data != null) {
                      PlusUi.onDocsPicked(this, data)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val ok = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                  when (requestCode) {
                      1 -> if (ok) listen() else note(l.micDenied)
                      2, 3 -> note(if (ok) l.permRetry else l.permNo)
                      5 -> if (ok) startWake() else note(l.wakeMic)
                      11 -> Interpreter.onPermission(ok)
                  }
              }

