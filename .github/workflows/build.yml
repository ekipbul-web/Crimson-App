              <path
                  android:fillColor="#801D6E82"
                  android:fillType="evenOdd"
                  android:pathData="M54,36A18,18 0 1,0 54,72A18,18 0 1,0 54,36ZM54,38A16,16 0 1,1 54,70A16,16 0 1,1 54,38Z" />
              <path
                  android:fillColor="#4CD9F2"
                  android:pathData="M54,46A8,8 0 1,0 54,62A8,8 0 1,0 54,46Z" />
          </vector>
          JARVIS_EOF_8
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'JARVIS_EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
